<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>留言板</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
            --md-primary: #8D6E63;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EFDBD1;
            --md-on-primary-container: #3E2723;
            --md-secondary: #A1887F;
            --md-secondary-container: #E5D5CF;
            --md-on-secondary-container: #3E2723;
            --md-surface: #FDF8F5;
            --md-surface-container: #F6ECE7;
            --md-surface-container-high: #F0E3DC;
            --md-on-surface: #1F1B16;
            --md-on-surface-variant: #52443C;
            --md-outline: #85736A;
            --md-outline-variant: #D8CCC4;
            --md-error: #BA1A1A;
            --md-on-error: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Microsoft YaHei', '微软雅黑', system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .shell {
            width: 100%;
            max-width: 720px;
        }

        .card {
            background: var(--md-surface-container);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--md-on-surface-variant);
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: transparent;
            border: 1px solid var(--md-outline);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 16px;
            color: var(--md-on-surface);
            outline: none;
            transition: border-color 0.15s, border-width 0.15s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            border: 2px solid var(--md-primary);
            padding: 11px 15px;
        }

        textarea {
            resize: vertical;
            min-height: 96px;
            line-height: 1.6;
        }

        .btn {
            border: none;
            cursor: pointer;
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 15px;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 999px;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover { opacity: 0.92; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status {
            font-size: 13px;
            color: var(--md-on-surface-variant);
        }
        .status.error { color: var(--md-error); }

        /* 留言列表 */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            background: var(--md-surface-container-high);
            border-radius: 16px;
            padding: 14px 18px;
        }

        .msg-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        .msg-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--md-on-primary-container);
        }

        .msg-time {
            font-size: 12px;
            color: var(--md-on-surface-variant);
            white-space: nowrap;
        }

        .msg-body {
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .msg-actions button {
            background: transparent;
            border: none;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: background-color .12s, color .12s;
        }

        .msg-actions button:hover {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
        }

        .msg-actions button.danger:hover {
            background: var(--md-error);
            color: var(--md-on-error);
        }

        .msg.mine .msg-name { color: var(--md-primary); }

        .replies {
            margin-top: 12px;
            padding-left: 14px;
            border-left: 3px solid var(--md-outline-variant);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg.reply {
            background: var(--md-surface-container);
            padding: 10px 14px;
            border-radius: 14px;
        }

        .msg.reply .msg-body { font-size: 14px; }

        .emoji-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .emoji-row button {
            background: transparent;
            border: 1px solid var(--md-outline-variant);
            border-radius: 10px;
            font-size: 17px;
            line-height: 1;
            padding: 6px 9px;
            cursor: pointer;
            transition: background-color .12s;
        }

        .emoji-row button:hover { background: var(--md-primary-container); }

        .reply-hint {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border-radius: 12px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .reply-hint.show { display: flex; }

        .reply-hint .rh-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-hint button {
            background: transparent;
            border: none;
            color: inherit;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
        }

        .counts {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--md-on-surface-variant);
            margin-bottom: 14px;
        }

        .empty {
            text-align: center;
            color: var(--md-on-surface-variant);
            font-size: 14px;
            padding: 28px 0;
        }

        footer {
            text-align: center;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            margin-top: 6px;
        }
        footer a {
            color: var(--md-primary);
            text-decoration: none;
        }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="shell">
        <div class="card">
            <h1>留言板</h1>
            <form id="form">
                <div class="reply-hint" id="replyHint">
                    <span class="rh-text" id="replyHintText"></span>
                    <button type="button" id="replyCancel" title="取消回复">×</button>
                </div>
                <div class="field-group">
                    <label for="name">昵称（可选）</label>
                    <input type="text" id="name" maxlength="50" placeholder="你的昵称">
                </div>
                <div class="field-group">
                    <label for="message">留言内容</label>
                    <textarea id="message" maxlength="1000" placeholder="写下你想说的话…"></textarea>
                </div>
                <div class="emoji-row" id="emojiRow"></div>
                <div class="form-foot">
                    <button class="btn" id="submitBtn" type="submit">发布留言</button>
                    <span class="status" id="status"></span>
                </div>
            </form>
        </div>

        <div class="card">
            <h1>全部留言</h1>
            <div class="counts" id="counts"></div>
            <div class="message-list" id="messageList">
                <div class="empty">加载中…</div>
            </div>
        </div>
    </div>

    <footer>
        2026 Qianchenawa. Licensed under MIT. Open source on <a rel="noopener noreferrer nofollow" href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a>
    </footer>

    <script>
    (function () {
        // 留言板走纯 HTTP 轮询：直接请求同源 /api/messages，
        // 由 Cloudflare Pages Functions 转发到 OpenFrp 隧道后的本机后端。
        var POLL_INTERVAL = 3000; // 轮询间隔（毫秒）
        var TOKEN_KEY = 'mb.tokens';

        var form = document.getElementById('form');
        var nameInput = document.getElementById('name');
        var messageInput = document.getElementById('message');
        var submitBtn = document.getElementById('submitBtn');
        var statusEl = document.getElementById('status');
        var listEl = document.getElementById('messageList');
        var countsEl = document.getElementById('counts');
        var replyHint = document.getElementById('replyHint');
        var replyHintText = document.getElementById('replyHintText');
        var replyCancel = document.getElementById('replyCancel');
        var emojiRow = document.getElementById('emojiRow');

        var replyTo = '';

        // ---------- 删除凭证（发布时服务端返回，保存于本地） ----------
        function readTokens() {
            try { return JSON.parse(localStorage.getItem(TOKEN_KEY) || '{}') || {}; }
            catch (e) { return {}; }
        }

        function saveToken(id, token) {
            var t = readTokens();
            t[id] = token;
            try { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
        }

        function forgetToken(id) {
            var t = readTokens();
            delete t[id];
            try { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
        }

        function isMine(id) { return !!readTokens()[id]; }

        // 清理已不存在留言的遗留凭证（例如随父留言一起被删除的回复）
        function pruneTokens(list) {
            var alive = {};
            (Array.isArray(list) ? list : []).forEach(function (m) { alive[m.id] = true; });
            var t = readTokens();
            var changed = false;
            Object.keys(t).forEach(function (id) {
                if (!alive[id]) { delete t[id]; changed = true; }
            });
            if (changed) {
                try { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
            }
        }

        // ---------- 表情快捷输入 ----------
        ['😀', '😂', '🥰', '😎', '🤔', '😭', '👍', '👏', '🎉', '❤️', '🔥', '🌙', '⭐', '🍀', '🐱', '☕'].forEach(function (e) {
            var b = document.createElement('button');
            b.type = 'button';
            b.textContent = e;
            b.addEventListener('click', function () {
                messageInput.value += e;
                messageInput.focus();
            });
            emojiRow.appendChild(b);
        });

        // ---------- 回复 ----------
        function setReply(id, name) {
            replyTo = id || '';
            if (replyTo) {
                replyHintText.textContent = '正在回复 @' + (name || '匿名');
                replyHint.classList.add('show');
            } else {
                replyHint.classList.remove('show');
                replyHintText.textContent = '';
            }
        }

        replyCancel.addEventListener('click', function () { setReply('', ''); });

        function formatTime(iso) {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            function pad(n) { return n < 10 ? '0' + n : n; }
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function byTimeAsc(a, b) { return new Date(a.time) - new Date(b.time); }
        function byTimeDesc(a, b) { return new Date(b.time) - new Date(a.time); }

        function makeMsg(m, isReply) {
            var el = document.createElement('div');
            el.className = 'msg' + (isReply ? ' reply' : '') + (isMine(m.id) ? ' mine' : '');

            var head = document.createElement('div');
            head.className = 'msg-head';

            var name = document.createElement('span');
            name.className = 'msg-name';
            name.textContent = (m.name || '匿名') + (isMine(m.id) ? '（我）' : '');

            var time = document.createElement('span');
            time.className = 'msg-time';
            time.textContent = formatTime(m.time);

            head.appendChild(name);
            head.appendChild(time);

            var body = document.createElement('div');
            body.className = 'msg-body';
            body.textContent = m.message;

            var actions = document.createElement('div');
            actions.className = 'msg-actions';

            var rp = document.createElement('button');
            rp.type = 'button';
            rp.textContent = '回复';
            rp.addEventListener('click', function () {
                setReply(m.id, m.name);
                messageInput.focus();
            });
            actions.appendChild(rp);

            if (isMine(m.id)) {
                var del = document.createElement('button');
                del.type = 'button';
                del.className = 'danger';
                del.textContent = '删除';
                del.addEventListener('click', function () { removeMessage(m); });
                actions.appendChild(del);
            }

            el.appendChild(head);
            el.appendChild(body);
            el.appendChild(actions);
            return el;
        }

        function render(messages) {
            var all = Array.isArray(messages) ? messages : [];

            if (!all.length) {
                listEl.replaceChildren();
                var empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = '还没有留言，来抢沙发吧～';
                listEl.appendChild(empty);
                countsEl.replaceChildren();
                return;
            }

            var byId = {};
            all.forEach(function (m) { byId[m.id] = m; });

            var tops = [];
            var children = {};
            all.forEach(function (m) {
                if (m.replyTo && byId[m.replyTo]) {
                    (children[m.replyTo] = children[m.replyTo] || []).push(m);
                } else {
                    tops.push(m);
                }
            });
            tops.sort(byTimeDesc);

            var frag = document.createDocumentFragment();
            tops.forEach(function (m) {
                var box = makeMsg(m, false);
                var kids = (children[m.id] || []).slice().sort(byTimeAsc);
                if (kids.length) {
                    var wrap = document.createElement('div');
                    wrap.className = 'replies';
                    kids.forEach(function (k) { wrap.appendChild(makeMsg(k, true)); });
                    box.appendChild(wrap);
                }
                frag.appendChild(box);
            });
            listEl.replaceChildren(frag);

            var today = new Date().toDateString();
            var todayCount = 0;
            var mineCount = 0;
            all.forEach(function (m) {
                if (new Date(m.time).toDateString() === today) todayCount++;
                if (isMine(m.id)) mineCount++;
            });

            countsEl.replaceChildren();
            ['共 ' + all.length + ' 条', '今日 ' + todayCount + ' 条', '我的 ' + mineCount + ' 条'].forEach(function (t) {
                var s = document.createElement('span');
                s.textContent = t;
                countsEl.appendChild(s);
            });
        }

        // ---------- 删除自己的留言 ----------
        function removeMessage(m) {
            var token = readTokens()[m.id];
            if (!token) return;
            var tip = m.replyTo ? '确定删除这条回复吗？' : '确定删除这条留言吗？（其下的回复也会一起删除）';
            if (!window.confirm(tip)) return;

            fetch('/api/messages/' + encodeURIComponent(m.id), {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
                .then(function (r) {
                    return r.json().then(function (j) {
                        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
                        return j;
                    });
                })
                .then(function () {
                    forgetToken(m.id);
                    setStatus('已删除', false);
                    setTimeout(function () { setStatus('', false); }, 1800);
                    loadMessages();
                })
                .catch(function (err) {
                    setStatus(err.message || '删除失败', true);
                });
        }

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (isError ? ' error' : '');
        }

        function loadMessages() {
            fetch('/api/messages')
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    setStatus('已连接（HTTP 轮询）', false);
                    setTimeout(function () { setStatus('', false); }, 1500);
                    pruneTokens(data);
                    render(data);
                })
                .catch(function () {
                    setStatus('无法连接服务器，请稍后重试', true);
                    var empty = listEl.querySelector('.empty');
                    if (empty && empty.textContent.indexOf('加载中') !== -1) {
                        empty.textContent = '无法连接服务器，请确认后端服务已启动';
                    }
                });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var message = messageInput.value.trim();
            if (!message) {
                setStatus('留言内容不能为空', true);
                return;
            }
            submitBtn.disabled = true;
            setStatus('发布中…', false);
            fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: nameInput.value.trim(),
                    message: message,
                    replyTo: replyTo
                })
            })
                .then(function (r) {
                    return r.json().then(function (j) {
                        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
                        return j;
                    });
                })
                .then(function (j) {
                    if (j && j.token && j.item && j.item.id) saveToken(j.item.id, j.token);
                    messageInput.value = '';
                    nameInput.value = '';
                    setReply('', '');
                    setStatus('发布成功', false);
                    setTimeout(function () { setStatus('', false); }, 2000);
                    loadMessages();
                })
                .catch(function (err) {
                    setStatus(err.message || '发布失败，请稍后重试', true);
                })
                .then(function () {
                    submitBtn.disabled = false;
                });
        });

        loadMessages();
        setInterval(loadMessages, POLL_INTERVAL);
    })();
    </script>
</body>
</html>
