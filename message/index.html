<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>留言板</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
            --md-primary: #8D6E63;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EFDBD1;
            --md-on-primary-container: #3E2723;
            --md-secondary: #A1887F;
            --md-secondary-container: #E5D5CF;
            --md-on-secondary-container: #3E2723;
            --md-surface: #FDF8F5;
            --md-surface-container: #F6ECE7;
            --md-surface-container-high: #F0E3DC;
            --md-on-surface: #1F1B16;
            --md-on-surface-variant: #52443C;
            --md-outline: #85736A;
            --md-outline-variant: #D8CCC4;
            --md-error: #BA1A1A;
            --md-on-error: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Microsoft YaHei', '微软雅黑', system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .shell {
            width: 100%;
            max-width: 720px;
        }

        .card {
            background: var(--md-surface-container);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--md-on-surface-variant);
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: transparent;
            border: 1px solid var(--md-outline);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 16px;
            color: var(--md-on-surface);
            outline: none;
            transition: border-color 0.15s, border-width 0.15s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            border: 2px solid var(--md-primary);
            padding: 11px 15px;
        }

        textarea {
            resize: vertical;
            min-height: 96px;
            line-height: 1.6;
        }

        .btn {
            border: none;
            cursor: pointer;
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 15px;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 999px;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover { opacity: 0.92; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status {
            font-size: 13px;
            color: var(--md-on-surface-variant);
        }
        .status.error { color: var(--md-error); }

        /* 留言列表 */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            background: var(--md-surface-container-high);
            border-radius: 16px;
            padding: 14px 18px;
        }

        .msg-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }

        .msg-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--md-on-primary-container);
        }

        .msg-time {
            font-size: 12px;
            color: var(--md-on-surface-variant);
            white-space: nowrap;
        }

        .msg-body {
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .empty {
            text-align: center;
            color: var(--md-on-surface-variant);
            font-size: 14px;
            padding: 28px 0;
        }

        footer {
            text-align: center;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            margin-top: 6px;
        }
        footer a {
            color: var(--md-primary);
            text-decoration: none;
        }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="shell">
        <div class="card">
            <h1>留言板</h1>
            <form id="form">
                <div class="field-group">
                    <label for="name">昵称（可选）</label>
                    <input type="text" id="name" maxlength="50" placeholder="你的昵称">
                </div>
                <div class="field-group">
                    <label for="message">留言内容</label>
                    <textarea id="message" maxlength="1000" placeholder="写下你想说的话…"></textarea>
                </div>
                <div class="form-foot">
                    <button class="btn" id="submitBtn" type="submit">发布留言</button>
                    <span class="status" id="status"></span>
                </div>
            </form>
        </div>

        <div class="card">
            <h1>全部留言</h1>
            <div class="message-list" id="messageList">
                <div class="empty">加载中…</div>
            </div>
        </div>
    </div>

    <footer>
        2026 Qianchenawa. All rights reserved. Open source on <a rel="noopener noreferrer nofollow" href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a>
    </footer>

    <script>
    (function () {
        // 动态发现隧道地址：先从固定地址获取当前 wss 地址，再连接
        // - HTTP 环境：用 OpenFrp 固定地址查询
        // - HTTPS 线上：用同源 /api/tunnel-url（CF Pages Functions 代理）
        var DISCOVERY_URL = (location.protocol === 'https:')
            ? '/api/tunnel-url'
            : 'http://1344a5becd3e.ofalias.com:41792/api/tunnel-url';
        var ws = null;
        var connected = false;

        var form = document.getElementById('form');
        var nameInput = document.getElementById('name');
        var messageInput = document.getElementById('message');
        var submitBtn = document.getElementById('submitBtn');
        var statusEl = document.getElementById('status');
        var listEl = document.getElementById('messageList');

        function formatTime(iso) {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            function pad(n) { return n < 10 ? '0' + n : n; }
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function render(messages) {
            if (!messages || messages.length === 0) {
                listEl.innerHTML = '<div class="empty">还没有留言，来抢沙发吧～</div>';
                return;
            }
            listEl.innerHTML = '';
            messages.slice().reverse().forEach(function (m) {
                var el = document.createElement('div');
                el.className = 'msg';
                var head = document.createElement('div');
                head.className = 'msg-head';
                var name = document.createElement('span');
                name.className = 'msg-name';
                name.textContent = m.name || '匿名';
                var time = document.createElement('span');
                time.className = 'msg-time';
                time.textContent = formatTime(m.time);
                head.appendChild(name);
                head.appendChild(time);
                var body = document.createElement('div');
                body.className = 'msg-body';
                body.textContent = m.message;
                el.appendChild(head);
                el.appendChild(body);
                listEl.appendChild(el);
            });
        }

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.className = 'status' + (isError ? ' error' : '');
        }

        function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            setStatus('正在获取隧道地址…', false);
            fetch(DISCOVERY_URL)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (!data || !data.url) {
                        setStatus('未获取到隧道地址，请先启动服务', true);
                        listEl.innerHTML = '<div class="empty">未获取到隧道地址，请先运行启动程序</div>';
                        return;
                    }
                    openWebSocket(data.url);
                })
                .catch(function () {
                    setStatus('无法连接服务器，请先启动服务', true);
                    listEl.innerHTML = '<div class="empty">无法连接服务器，请先运行启动程序</div>';
                });
        }

        function openWebSocket(url) {
            setStatus('连接中…', false);
            ws = new WebSocket(url);

            ws.onopen = function () {
                connected = true;
                setStatus('已连接（WebSocket/TCP）', false);
                setTimeout(function () { setStatus('', false); }, 1500);
                ws.send(JSON.stringify({ type: 'get' }));
            };

            ws.onmessage = function (ev) {
                var msg;
                try { msg = JSON.parse(ev.data); } catch (e) { return; }
                if (msg.type === 'list') {
                    render(msg.messages);
                } else if (msg.type === 'error') {
                    setStatus(msg.error || '服务器返回错误', true);
                }
            };

            ws.onclose = function () {
                connected = false;
                setStatus('连接已断开', true);
                listEl.innerHTML = '<div class="empty">连接已断开，请先运行 <code>node server.js</code> 后刷新页面</div>';
            };

            ws.onerror = function () {
                connected = false;
                setStatus('连接失败', true);
            };
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var message = messageInput.value.trim();
            if (!message) {
                setStatus('留言内容不能为空', true);
                return;
            }
            if (!connected || !ws || ws.readyState !== WebSocket.OPEN) {
                setStatus('尚未连接服务器，正在重连…', true);
                connect();
                submitBtn.disabled = false;
                return;
            }
            submitBtn.disabled = true;
            setStatus('发布中…', false);
            ws.send(JSON.stringify({
                type: 'post',
                name: nameInput.value.trim(),
                message: message
            }));
            messageInput.value = '';
            nameInput.value = '';
            setStatus('发布成功', false);
            setTimeout(function () { setStatus('', false); }, 2000);
            submitBtn.disabled = false;
        });

        connect();
    })();
    </script>
</body>
</html>
