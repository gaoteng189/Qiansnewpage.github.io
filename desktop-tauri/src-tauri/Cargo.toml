[package]
name = "qiansnewpage"
version = "1.0.0"
description = "千叶新页桌面版 —— 工具箱 / 小说阅读 / 待办 / 留言板 / 小游戏"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 外壳：用系统 WebView2，不打包 Chromium（这是相对 Electron 191 MB 的核心优势）
# devtools：让发布版也保留「开发者工具」菜单项，与 Electron 版功能对齐
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# 本地 HTTP 服务：完全复刻 server.js 的路由，前端页面一行都不用改
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

# 发布体积优先：Electron 版打包后 191 MB，这里要压到个位数 MB
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
