<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>前端工具集 · 哈希 · 加密 · 绘图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', '微软雅黑',-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 28px 24px 34px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .sub {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 26px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 14px;
        }

        /* ----- 卡片通用 ----- */
        .card {
            background: #f9fbfd;
            border-radius: 20px;
            padding: 20px 22px 26px;
            border: 1px solid #eef2f6;
            margin-bottom: 28px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        /* ----- 表单控件 ----- */
        label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            display: block;
            margin-bottom: 3px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dce2ea;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .btn {
            padding: 10px 22px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #2563eb;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #eef2f6;
            color: #1e293b;
        }
        .btn-secondary:hover {
            background: #dce2ea;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .result-box {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            font-family: "SF Mono", "JetBrains Mono", monospace;
            font-size: 14px;
            word-break: break-all;
            color: #0f172a;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .result-box .text {
            flex: 1;
            line-height: 1.6;
        }

        .result-box .copy-btn {
            background: #eef2f6;
            border: none;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #334155;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .result-box .copy-btn:hover {
            background: #dce2ea;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .verify-result {
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
        }
        .verify-result.success {
            color: #16a34a;
        }
        .verify-result.fail {
            color: #dc2626;
        }

        /* ----- 函数可视化专用 ----- */
        .canvas-wrapper {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-top: 6px;
        }

        canvas#functionCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
            background: white;
            touch-action: none;
        }

        .canvas-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            text-align: center;
        }

        .sample-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .sample-btns button {
            padding: 4px 12px;
            border: 1px solid #dce2ea;
            border-radius: 16px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sample-btns button:hover {
            background: #eef2f6;
        }
        p {
         text-align: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>前端工具集</h1>
        <div class="sub">SHA‑256 哈希 · AES 对称加密 · 函数绘图（纯前端）</div>

        <!-- ======================== 工具1: SHA-256 ======================== -->
        <div class="card">
            <h2>SHA‑256 哈希生成器 &amp; 验证器</h2>
            <div class="row">
                <div>
                    <div class="input-group">
                        <label>输入文本</label>
                        <input type="text" id="hashInput" placeholder="输入要哈希的文本..." />
                    </div>
                    <div class="btn-group">
                        <button class="btn" id="hashBtn">生成哈希</button>
                        <button class="btn btn-secondary btn-sm" id="hashSampleBtn">示例</button>
                        <button class="btn btn-secondary btn-sm" id="hashClearBtn">清空</button>
                    </div>
                    <div class="result-box">
                        <span class="text" id="hashResult">等待计算...</span>
                        <button class="copy-btn" id="copyHashBtn">复制</button>
                    </div>
                </div>
                <div>
                    <div class="input-group">
                        <label>验证哈希（输入原文和哈希值）</label>
                        <input type="text" id="verifyOriginal" placeholder="原文" style="margin-bottom:6px;" />
                        <input type="text" id="verifyHash" placeholder="哈希值" />
                    </div>
                    <button class="btn btn-sm" id="verifyBtn">验证</button>
                    <div id="verifyResult" class="verify-result"></div>
                </div>
            </div>
        </div>

        <!-- ======================== 工具2: 对称加密/解密 ======================== -->
        <div class="card">
            <h2>对称加密 / 解密（AES‑GCM）</h2>
            <div class="row">
                <div>
                    <div class="input-group">
                        <label>密码（加密/解密共用）</label>
                        <input type="password" id="cryptoPassword" placeholder="输入密码" />
                    </div>
                    <div class="input-group">
                        <label>原文（加密时填写）</label>
                        <input type="text" id="cryptoPlain" placeholder="要加密的文本" />
                    </div>
                    <div class="btn-group">
                        <button class="btn" id="encryptBtn">加密</button>
                        <button class="btn btn-secondary btn-sm" id="cryptoSampleBtn">示例</button>
                    </div>
                    <div class="result-box">
                        <span class="text" id="encryptResult">等待加密...</span>
                        <button class="copy-btn" id="copyEncryptBtn">复制</button>
                    </div>
                </div>
                <div>
                    <div class="input-group">
                        <label>密文（Base64，解密时粘贴）</label>
                        <input type="text" id="cryptoCipher" placeholder="粘贴密文..." />
                    </div>
                    <div class="btn-group">
                        <button class="btn" id="decryptBtn">解密</button>
                        <button class="btn btn-secondary btn-sm" id="cryptoClearBtn">清空</button>
                    </div>
                    <div class="result-box">
                        <span class="text" id="decryptResult">等待解密...</span>
                        <button class="copy-btn" id="copyDecryptBtn">复制</button>
                    </div>
                    <div class="hint">说明：使用 AES‑GCM 256 位，每次加密生成随机 IV，密文格式：<code>IV(12字节Base64) + 密文 + Tag</code></div>
                </div>
            </div>
        </div>

        <!-- ======================== 工具3: 函数可视化 ======================== -->
        <div class="card">
            <h2>函数可视化</h2>
            <div class="row" style="grid-template-columns: 1fr 1fr auto;">
                <div class="input-group" style="margin-bottom:0;">
                    <label>f(x) =</label>
                    <input type="text" id="funcInput" value="Math.sin(x)" />
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <div class="input-group" style="flex:1; min-width:70px;">
                        <label>X 最小</label>
                        <input type="number" id="xMin" value="-6.28" step="0.1" />
                    </div>
                    <div class="input-group" style="flex:1; min-width:70px;">
                        <label>X 最大</label>
                        <input type="number" id="xMax" value="6.28" step="0.1" />
                    </div>
                    <div class="input-group" style="flex:1; min-width:70px;">
                        <label>点数</label>
                        <input type="number" id="points" value="200" step="10" min="10" max="1000" />
                    </div>
                </div>
                <div style="display:flex; align-items:flex-end; gap:8px;">
                    <button class="btn" id="drawBtn">绘制</button>
                </div>
            </div>
            <div class="sample-btns">
                <button data-fn="Math.sin(x)">sin(x)</button>
                <button data-fn="x*x">x²</button>
                <button data-fn="Math.cos(x)">cos(x)</button>
                <button data-fn="2*x+1">2x+1</button>
                <button data-fn="Math.tan(x)">tan(x)</button>
                <button data-fn="Math.exp(x)">e^x</button>
                <button data-fn="Math.log(x+1)">ln(x+1)</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="functionCanvas" width="600" height="450"></canvas>
            </div>
            <div class="canvas-hint" id="canvasHint">鼠标悬停显示坐标</div>
        </div>
        <p>
                  2026 © Qianchenawa. All rights reserved.    Open source on <a href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a>
      </p>
    </div>
    
    <script>
        (function() {
            'use strict';

            // ==============================================================
            //  工具1: SHA-256 哈希 + 验证
            // ==============================================================
            const hashInput = document.getElementById('hashInput');
            const hashBtn = document.getElementById('hashBtn');
            const hashResult = document.getElementById('hashResult');
            const copyHashBtn = document.getElementById('copyHashBtn');
            const hashClearBtn = document.getElementById('hashClearBtn');
            const hashSampleBtn = document.getElementById('hashSampleBtn');
            const verifyOriginal = document.getElementById('verifyOriginal');
            const verifyHash = document.getElementById('verifyHash');
            const verifyBtn = document.getElementById('verifyBtn');
            const verifyResult = document.getElementById('verifyResult');

            async function sha256(message) {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function handleHash() {
                const text = hashInput.value.trim();
                if (!text) { hashResult.textContent = '请输入文本'; return; }
                hashResult.textContent = '计算中...';
                try {
                    const hash = await sha256(text);
                    hashResult.textContent = hash;
                } catch (e) {
                    hashResult.textContent = '错误' + e.message;
                }
            }

            hashBtn.addEventListener('click', handleHash);
            hashInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    handleHash(); } });

            copyHashBtn.addEventListener('click', () => {
                const txt = hashResult.textContent;
                if (txt && !txt.startsWith('警告') && !txt.startsWith('请稍等...') && !txt.startsWith('错误！')) {
                    navigator.clipboard.writeText(txt).then(() => {
                        const orig = copyHashBtn.textContent;
                        copyHashBtn.textContent = '已复制';
                        setTimeout(() => copyHashBtn.textContent = orig, 1500);
                    }).catch(() => { alert('复制失败，请手动复制'); });
                }
            });

            hashClearBtn.addEventListener('click', () => { hashInput.value = '';
                hashResult.textContent = '等待计算...';
                hashInput.focus(); });
            hashSampleBtn.addEventListener('click', () => { hashInput.value = 'Hello, 前端工具!';
                handleHash(); });

            // 验证
            verifyBtn.addEventListener('click', async () => {
                const orig = verifyOriginal.value.trim();
                const expected = verifyHash.value.trim();
                if (!orig || !expected) { verifyResult.textContent = '请填写原文和哈希值';
                    verifyResult.className = 'verify-result fail'; return; }
                try {
                    const hash = await sha256(orig);
                    if (hash === expected) {
                        verifyResult.textContent = '验证通过！原文匹配哈希。';
                        verifyResult.className = 'verify-result success';
                    } else {
                        verifyResult.textContent = '验证失败！哈希不匹配。';
                        verifyResult.className = 'verify-result fail';
                    }
                } catch (e) {
                    verifyResult.textContent = '错误：' + e.message;
                    verifyResult.className = 'verify-result fail';
                }
            });

            // ==============================================================
            //  工具2: 对称加密/解密 (AES-GCM)
            // ==============================================================
            const cryptoPassword = document.getElementById('cryptoPassword');
            const cryptoPlain = document.getElementById('cryptoPlain');
            const encryptBtn = document.getElementById('encryptBtn');
            const encryptResult = document.getElementById('encryptResult');
            const copyEncryptBtn = document.getElementById('copyEncryptBtn');
            const cryptoSampleBtn = document.getElementById('cryptoSampleBtn');
            const cryptoCipher = document.getElementById('cryptoCipher');
            const decryptBtn = document.getElementById('decryptBtn');
            const decryptResult = document.getElementById('decryptResult');
            const copyDecryptBtn = document.getElementById('copyDecryptBtn');
            const cryptoClearBtn = document.getElementById('cryptoClearBtn');

            // 从密码派生密钥 (PBKDF2)
            async function getKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
                );
                return crypto.subtle.deriveKey({
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial, { name: 'AES-GCM', length: 256 },
                    false, ['encrypt', 'decrypt']
                );
            }

            // 加密
            async function encryptText(plaintext, password) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await getKey(password, salt);
                const enc = new TextEncoder();
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv },
                    key,
                    enc.encode(plaintext)
                );
                // 拼接 salt + iv + ciphertext (全部转为Base64)
                const combined = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
                combined.set(salt, 0);
                combined.set(iv, salt.length);
                combined.set(new Uint8Array(ciphertext), salt.length + iv.length);
                return btoa(String.fromCharCode(...combined));
            }

            // 解密
            async function decryptText(base64Data, password) {
                const combined = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const ciphertext = combined.slice(28);
                const key = await getKey(password, salt);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(decrypted);
            }

            encryptBtn.addEventListener('click', async () => {
                const password = cryptoPassword.value.trim();
                const plain = cryptoPlain.value.trim();
                if (!password) { encryptResult.textContent = '请输入密码'; return; }
                if (!plain) { encryptResult.textContent = '请输入要加密的文本'; return; }
                try {
                    encryptResult.textContent = '加密中...';
                    const encrypted = await encryptText(plain, password);
                    encryptResult.textContent = encrypted;
                } catch (e) {
                    encryptResult.textContent = '错误' + e.message;
                }
            });

            decryptBtn.addEventListener('click', async () => {
                const password = cryptoPassword.value.trim();
                const cipher = cryptoCipher.value.trim();
                if (!password) { decryptResult.textContent = '请输入密码'; return; }
                if (!cipher) { decryptResult.textContent = '请输入密文'; return; }
                try {
                    decryptResult.textContent = '解密中...';
                    const plain = await decryptText(cipher, password);
                    decryptResult.textContent = plain;
                } catch (e) {
                    decryptResult.textContent = '解密失败，请检查密码和密文格式';
                }
            });

            copyEncryptBtn.addEventListener('click', () => {
                const txt = encryptResult.textContent;
                if (txt && !txt.startsWith('警告') && !txt.startsWith('请稍等...') && !txt.startsWith('错误！')) {
                    navigator.clipboard.writeText(txt).then(() => {
                        const orig = copyEncryptBtn.textContent;
                        copyEncryptBtn.textContent = '已复制';
                        setTimeout(() => copyEncryptBtn.textContent = orig, 1500);
                    });
                }
            });

            copyDecryptBtn.addEventListener('click', () => {
                const txt = decryptResult.textContent;
                if (txt && !txt.startsWith('警告') && !txt.startsWith('请稍等...') && !txt.startsWith('错误！')) {
                    navigator.clipboard.writeText(txt).then(() => {
                        const orig = copyDecryptBtn.textContent;
                        copyDecryptBtn.textContent = '已复制';
                        setTimeout(() => copyDecryptBtn.textContent = orig, 1500);
                    });
                }
            });

            cryptoSampleBtn.addEventListener('click', () => {
                cryptoPassword.value = 'mySecret123';
                cryptoPlain.value = 'Hello, 这是加密测试文本！';
                encryptBtn.click();
            });

            cryptoClearBtn.addEventListener('click', () => {
                cryptoPassword.value = '';
                cryptoPlain.value = '';
                cryptoCipher.value = '';
                encryptResult.textContent = '等待加密...';
                decryptResult.textContent = '等待解密...';
            });

            // ==============================================================
            //  工具3: 函数可视化 (保留)
            // ==============================================================
            const canvas = document.getElementById('functionCanvas');
            const ctx = canvas.getContext('2d');
            const funcInput = document.getElementById('funcInput');
            const xMinInput = document.getElementById('xMin');
            const xMaxInput = document.getElementById('xMax');
            const pointsInput = document.getElementById('points');
            const drawBtn = document.getElementById('drawBtn');
            const canvasHint = document.getElementById('canvasHint');

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                const width = rect.width || 600;
                const height = width * 0.75;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.scale(dpr, dpr);
                canvas._logicalWidth = width;
                canvas._logicalHeight = height;
            }

            let lastYMin = -1,
                lastYMax = 1;

            function drawFunction() {
                const expr = funcInput.value.trim();
                if (!expr) { alert('请输入函数表达式'); return; }
                const xMin = parseFloat(xMinInput.value);
                const xMax = parseFloat(xMaxInput.value);
                if (isNaN(xMin) || isNaN(xMax) || xMin >= xMax) { alert('请输入有效的范围'); return; }
                let points = parseInt(pointsInput.value, 10) || 200;
                if (points < 2) points = 2;

                let fn;
                try { fn = new Function('x', `"use strict"; return (${expr});`); } catch (e) {
                    alert('函数语法错误: ' + e.message);
                    return;
                }

                const step = (xMax - xMin) / (points - 1);
                const data = [];
                let yMin = Infinity,
                    yMax = -Infinity;
                for (let i = 0; i < points; i++) {
                    const x = xMin + i * step;
                    let y;
                    try { y = fn(x); } catch (e) { y = NaN; }
                    if (typeof y === 'number' && isFinite(y)) {
                        data.push({ x, y });
                        if (y < yMin) yMin = y;
                        if (y > yMax) yMax = y;
                    } else {
                        data.push({ x, y: NaN });
                    }
                }
                if (yMin === Infinity) { yMin = -1;
                    yMax = 1; }
                const yRange = yMax - yMin;
                if (yRange === 0) { yMin -= 1;
                    yMax += 1; } else {
                    const pad = yRange * 0.1;
                    yMin -= pad;
                    yMax += pad;
                }
                lastYMin = yMin;
                lastYMax = yMax;

                const W = canvas._logicalWidth;
                const H = canvas._logicalHeight;
                ctx.clearRect(0, 0, W, H);

                function xToPixel(x) { return ((x - xMin) / (xMax - xMin)) * W; }

                function yToPixel(y) { return H - ((y - yMin) / (yMax - yMin)) * H; }

                // 网格
                ctx.save();
                ctx.strokeStyle = '#e9edf2';
                ctx.lineWidth = 0.5;
                const xStep = Math.pow(10, Math.floor(Math.log10((xMax - xMin) / 5)));
                let xGrid = Math.ceil(xMin / xStep) * xStep;
                while (xGrid <= xMax) {
                    const px = xToPixel(xGrid);
                    ctx.beginPath();
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, H);
                    ctx.stroke();
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    const label = (Math.abs(xGrid) < 1e-9) ? '0' : (xGrid % 1 === 0 ? xGrid.toString() : xGrid.toFixed(2));
                    ctx.fillText(label, px, H - 14);
                    xGrid += xStep;
                }
                const yStep = Math.pow(10, Math.floor(Math.log10((yMax - yMin) / 5)));
                let yGrid = Math.ceil(yMin / yStep) * yStep;
                while (yGrid <= yMax) {
                    const py = yToPixel(yGrid);
                    ctx.beginPath();
                    ctx.moveTo(0, py);
                    ctx.lineTo(W, py);
                    ctx.stroke();
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    const label = (Math.abs(yGrid) < 1e-9) ? '0' : (yGrid % 1 === 0 ? yGrid.toString() : yGrid.toFixed(2));
                    ctx.fillText(label, 12, py);
                    yGrid += yStep;
                }

                // 坐标轴
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1.5;
                if (yMin <= 0 && yMax >= 0) {
                    const py0 = yToPixel(0);
                    ctx.beginPath();
                    ctx.moveTo(0, py0);
                    ctx.lineTo(W, py0);
                    ctx.stroke();
                }
                if (xMin <= 0 && xMax >= 0) {
                    const px0 = xToPixel(0);
                    ctx.beginPath();
                    ctx.moveTo(px0, 0);
                    ctx.lineTo(px0, H);
                    ctx.stroke();
                }

                // 曲线
                ctx.beginPath();
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 3;
                let started = false;
                for (let i = 0; i < data.length; i++) {
                    const d = data[i];
                    if (isNaN(d.y)) { started = false; continue; }
                    const px = xToPixel(d.x);
                    const py = yToPixel(d.y);
                    if (px < 0 || px > W || py < 0 || py > H) { started = false; continue; }
                    if (!started) { ctx.moveTo(px, py);
                        started = true; } else ctx.lineTo(px, py);
                }
                ctx.stroke();

                ctx.restore();
                canvasHint.textContent = `图表 x:[${xMin.toFixed(2)},${xMax.toFixed(2)}]  y:[${yMin.toFixed(2)},${yMax.toFixed(2)}]  点数:${data.length}`;
            }

            // 鼠标交互
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas._logicalWidth / rect.width;
                const scaleY = canvas._logicalHeight / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                const xMin = parseFloat(xMinInput.value);
                const xMax = parseFloat(xMaxInput.value);
                const x = xMin + (mx / canvas._logicalWidth) * (xMax - xMin);
                const y = lastYMin + (1 - my / canvas._logicalHeight) * (lastYMax - lastYMin);
                let realY = null;
                try {
                    const fn = new Function('x', `"use strict"; return (${funcInput.value.trim()});`);
                    realY = fn(x);
                } catch (e) { /* ignore */ }
                if (realY !== null && isFinite(realY)) {
                    canvasHint.textContent = `Pos x = ${x.toFixed(4)},  f(x) = ${realY.toFixed(4)}`;
                } else {
                    canvasHint.textContent = `Pos x = ${x.toFixed(4)}`;
                }
            });
            canvas.addEventListener('mouseleave', () => {
                canvasHint.textContent = '鼠标悬停显示坐标';
            });

            drawBtn.addEventListener('click', drawFunction);
            document.querySelectorAll('.sample-btns button').forEach(btn => {
                btn.addEventListener('click', () => {
                    funcInput.value = btn.dataset.fn;
                    drawFunction();
                });
            });

            // 输入回车触发绘制
            [funcInput, xMinInput, xMaxInput, pointsInput].forEach(el => {
                el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                        drawFunction(); } });
            });
            [xMinInput, xMaxInput, pointsInput].forEach(el => el.addEventListener('change', drawFunction));

            window.addEventListener('load', () => {
                resizeCanvas();
                drawFunction();
            });
            window.addEventListener('resize', () => {
                resizeCanvas();
                drawFunction();
            });

            // 初始聚焦
            hashInput.focus();

        })();
    </script>
    
</body>
</html>
