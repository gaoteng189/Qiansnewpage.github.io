<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔐 SHA-256 加密器 + 📈 函数可视化</title>
    <style>
        /* ----- 全局重置 & 基础 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 28px 24px 34px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .sub {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 28px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 14px;
        }

        /* ----- 双列布局 ----- */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 720px) {
            .row {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        .card {
            background: #f9fbfd;
            border-radius: 20px;
            padding: 20px 22px 26px;
            border: 1px solid #eef2f6;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ----- SHA-256 样式 ----- */
        .hash-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .hash-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #dce2ea;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            min-width: 160px;
        }

        .hash-input-area input:focus {
            border-color: #3b82f6;
        }

        .hash-input-area button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .hash-input-area button:hover {
            background: #2563eb;
        }
        .hash-input-area button:active {
            transform: scale(0.96);
        }

        .hash-result {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            font-family: "SF Mono", "JetBrains Mono", monospace;
            font-size: 14px;
            word-break: break-all;
            color: #0f172a;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .hash-result .hash-text {
            flex: 1;
            line-height: 1.6;
        }

        .hash-result .copy-btn {
            background: #eef2f6;
            border: none;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #334155;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .hash-result .copy-btn:hover {
            background: #dce2ea;
        }

        .hash-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .hash-actions button {
            padding: 6px 18px;
            border: none;
            border-radius: 20px;
            background: #eef2f6;
            font-size: 13px;
            cursor: pointer;
            color: #334155;
            transition: background 0.2s;
        }

        .hash-actions button:hover {
            background: #dce2ea;
        }
        .hash-actions .clear-btn {
            color: #dc2626;
        }
        .hash-actions .clear-btn:hover {
            background: #fee2e2;
        }

        /* ----- 函数可视化样式 ----- */
        .viz-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-bottom: 14px;
            align-items: flex-end;
        }

        .viz-controls .field {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1 0 100px;
        }

        .viz-controls .field label {
            font-size: 12px;
            font-weight: 500;
            color: #475569;
            letter-spacing: 0.3px;
        }

        .viz-controls .field input {
            padding: 8px 12px;
            border: 2px solid #dce2ea;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .viz-controls .field input:focus {
            border-color: #3b82f6;
        }

        .viz-controls .field input[type="number"] {
            width: 100px;
        }

        .viz-btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .viz-btn-group button {
            padding: 8px 18px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .viz-btn-group button:hover {
            background: #2563eb;
        }

        .viz-btn-group .sample-btn {
            background: #eef2f6;
            color: #1e293b;
            font-size: 13px;
            padding: 6px 14px;
        }

        .viz-btn-group .sample-btn:hover {
            background: #dce2ea;
        }

        .canvas-wrapper {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-top: 6px;
            position: relative;
        }

        canvas#functionCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
            background: white;
            touch-action: none;
        }

        .canvas-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            text-align: center;
        }

        /* ----- 通用 ----- */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mt-2 {
            margin-top: 12px;
        }

        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>🧰 前端工具集</h1>
        <div class="sub">🔐 SHA-256 加密 ｜ 📈 函数可视化（纯前端，数据不上传）</div>

        <div class="row">
            <!-- ============ SHA-256 加密器 ============ -->
            <div class="card">
                <h2>🔐 SHA-256 加密器</h2>
                <div class="hash-input-area">
                    <input type="text" id="hashInput" placeholder="输入要加密的文本..." autofocus />
                    <button id="hashBtn">加密</button>
                </div>
                <div class="hash-result">
                    <span class="hash-text" id="hashResult">等待计算...</span>
                    <button class="copy-btn" id="copyHashBtn">复制</button>
                </div>
                <div class="hash-actions">
                    <button class="clear-btn" id="clearHashBtn">清空</button>
                    <button id="sampleHashBtn" style="background:#eef2f6;">示例文本</button>
                </div>
                <div style="margin-top:14px; font-size:13px; color:#64748b;">
                    ⚡ 使用 Web Crypto API，浏览器原生计算。
                </div>
            </div>

            <!-- ============ 函数可视化 ============ -->
            <div class="card">
                <h2>📈 函数可视化</h2>
                <div class="viz-controls">
                    <div class="field">
                        <label>函数 f(x) =</label>
                        <input type="text" id="funcInput" value="Math.sin(x)" placeholder="例如 x*x" />
                    </div>
                    <div class="field" style="flex:0 0 80px;">
                        <label>X 最小值</label>
                        <input type="number" id="xMin" value="-6.28" step="0.1" />
                    </div>
                    <div class="field" style="flex:0 0 80px;">
                        <label>X 最大值</label>
                        <input type="number" id="xMax" value="6.28" step="0.1" />
                    </div>
                    <div class="field" style="flex:0 0 80px;">
                        <label>点数</label>
                        <input type="number" id="points" value="200" step="10" min="10" max="1000" />
                    </div>
                </div>
                <div class="viz-btn-group">
                    <button id="drawBtn">绘制</button>
                    <button class="sample-btn" data-fn="Math.sin(x)">sin(x)</button>
                    <button class="sample-btn" data-fn="x*x">x²</button>
                    <button class="sample-btn" data-fn="Math.cos(x)">cos(x)</button>
                    <button class="sample-btn" data-fn="2*x+1">2x+1</button>
                    <button class="sample-btn" data-fn="Math.tan(x)">tan(x)</button>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="functionCanvas" width="600" height="450"></canvas>
                </div>
                <div class="canvas-hint">
                    🖱️ 鼠标悬停显示坐标值（正在绘制...）
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==============================================================
            //  1. SHA-256 加密器
            // ==============================================================
            const hashInput = document.getElementById('hashInput');
            const hashBtn = document.getElementById('hashBtn');
            const hashResult = document.getElementById('hashResult');
            const copyHashBtn = document.getElementById('copyHashBtn');
            const clearHashBtn = document.getElementById('clearHashBtn');
            const sampleHashBtn = document.getElementById('sampleHashBtn');

            // 使用 Web Crypto API 计算 SHA-256
            async function sha256(message) {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function handleHash() {
                const text = hashInput.value.trim();
                if (!text) {
                    hashResult.textContent = '⚠️ 请输入要加密的文本';
                    return;
                }
                hashResult.textContent = '⏳ 计算中...';
                try {
                    const hash = await sha256(text);
                    hashResult.textContent = hash;
                } catch (err) {
                    hashResult.textContent = '❌ 加密失败：' + err.message;
                }
            }

            hashBtn.addEventListener('click', handleHash);
            hashInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleHash();
                }
            });

            copyHashBtn.addEventListener('click', () => {
                const text = hashResult.textContent;
                if (text && !text.startsWith('⚠️') && !text.startsWith('⏳') && !text.startsWith('❌')) {
                    navigator.clipboard.writeText(text).then(() => {
                        const orig = copyHashBtn.textContent;
                        copyHashBtn.textContent = '✅ 已复制';
                        setTimeout(() => { copyHashBtn.textContent = orig; }, 1500);
                    }).catch(() => {
                        // fallback
                        const range = document.createRange();
                        range.selectNode(hashResult);
                        window.getSelection().removeAllRanges();
                        window.getSelection().addRange(range);
                        document.execCommand('copy');
                        window.getSelection().removeAllRanges();
                        const orig = copyHashBtn.textContent;
                        copyHashBtn.textContent = '✅ 已复制';
                        setTimeout(() => { copyHashBtn.textContent = orig; }, 1500);
                    });
                } else {
                    alert('没有可复制的内容');
                }
            });

            clearHashBtn.addEventListener('click', () => {
                hashInput.value = '';
                hashResult.textContent = '等待计算...';
                hashInput.focus();
            });

            sampleHashBtn.addEventListener('click', () => {
                hashInput.value = 'Hello, 前端工具!';
                handleHash();
            });

            // ==============================================================
            //  2. 函数可视化 (Canvas)
            // ==============================================================
            const canvas = document.getElementById('functionCanvas');
            const ctx = canvas.getContext('2d');
            const funcInput = document.getElementById('funcInput');
            const xMinInput = document.getElementById('xMin');
            const xMaxInput = document.getElementById('xMax');
            const pointsInput = document.getElementById('points');
            const drawBtn = document.getElementById('drawBtn');

            // 设置 Canvas 实际尺寸 (保持宽高比 4:3)
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                // 保持绘图清晰，使用物理像素
                const dpr = window.devicePixelRatio || 1;
                const width = rect.width || 600;
                const height = width * 0.75; // 4:3
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.scale(dpr, dpr);
                // 保存逻辑尺寸以便绘图
                canvas._logicalWidth = width;
                canvas._logicalHeight = height;
            }

            // 绘制函数
            function drawFunction() {
                const expr = funcInput.value.trim();
                if (!expr) {
                    alert('请输入函数表达式');
                    return;
                }
                const xMin = parseFloat(xMinInput.value);
                const xMax = parseFloat(xMaxInput.value);
                if (isNaN(xMin) || isNaN(xMax) || xMin >= xMax) {
                    alert('请输入有效的 x 范围（最小值 < 最大值）');
                    return;
                }
                let points = parseInt(pointsInput.value, 10);
                if (isNaN(points) || points < 2) points = 100;

                // 构建函数: 使用 Function 构造函数，将 x 作为参数
                let fn;
                try {
                    fn = new Function('x', `"use strict"; return (${expr});`);
                } catch (e) {
                    alert('函数表达式有语法错误: ' + e.message);
                    return;
                }

                // 测试几个点
                try {
                    fn(xMin);
                    fn((xMin + xMax) / 2);
                    fn(xMax);
                } catch (e) {
                    alert('函数计算错误: ' + e.message);
                    return;
                }

                // 计算数据点
                const step = (xMax - xMin) / (points - 1);
                const data = [];
                let yMin = Infinity,
                    yMax = -Infinity;
                for (let i = 0; i < points; i++) {
                    const x = xMin + i * step;
                    let y;
                    try {
                        y = fn(x);
                    } catch (e) {
                        y = NaN;
                    }
                    if (typeof y !== 'number' || !isFinite(y)) {
                        data.push({ x, y: NaN });
                    } else {
                        data.push({ x, y });
                        if (y < yMin) yMin = y;
                        if (y > yMax) yMax = y;
                    }
                }

                // 如果所有点都是 NaN
                if (yMin === Infinity) {
                    alert('函数在所有采样点上都无效（NaN 或 Infinity）');
                    return;
                }

                // 适当扩展 y 范围，留白
                const yRange = yMax - yMin;
                if (yRange === 0) {
                    yMin -= 1;
                    yMax += 1;
                } else {
                    const pad = yRange * 0.1;
                    yMin -= pad;
                    yMax += pad;
                }

                // 准备绘制
                const W = canvas._logicalWidth;
                const H = canvas._logicalHeight;
                ctx.clearRect(0, 0, W, H);

                // ---- 绘制网格和坐标轴 ----
                ctx.save();

                // 背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);

                // 坐标变换：将数据坐标 (x,y) 映射到 canvas 像素
                function xToPixel(x) {
                    return ((x - xMin) / (xMax - xMin)) * W;
                }

                function yToPixel(y) {
                    return H - ((y - yMin) / (yMax - yMin)) * H;
                }

                // 绘制网格线（浅灰）
                ctx.strokeStyle = '#e9edf2';
                ctx.lineWidth = 0.5;

                // 垂直网格（根据范围自动选择步长）
                const xStep = Math.pow(10, Math.floor(Math.log10((xMax - xMin) / 5)));
                let xGrid = Math.ceil(xMin / xStep) * xStep;
                while (xGrid <= xMax) {
                    const px = xToPixel(xGrid);
                    ctx.beginPath();
                    ctx.moveTo(px, 0);
                    ctx.lineTo(px, H);
                    ctx.stroke();
                    // 标数字
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    const label = (Math.abs(xGrid) < 1e-9) ? '0' : (xGrid % 1 === 0 ? xGrid.toString() : xGrid.toFixed(2));
                    ctx.fillText(label, px, H - 14);
                    xGrid += xStep;
                }

                // 水平网格
                const yStep = Math.pow(10, Math.floor(Math.log10((yMax - yMin) / 5)));
                let yGrid = Math.ceil(yMin / yStep) * yStep;
                while (yGrid <= yMax) {
                    const py = yToPixel(yGrid);
                    ctx.beginPath();
                    ctx.moveTo(0, py);
                    ctx.lineTo(W, py);
                    ctx.stroke();
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    const label = (Math.abs(yGrid) < 1e-9) ? '0' : (yGrid % 1 === 0 ? yGrid.toString() : yGrid.toFixed(2));
                    ctx.fillText(label, 12, py);
                    yGrid += yStep;
                }

                // 绘制坐标轴（黑色实线）
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1.5;
                // x轴 (y=0)
                if (yMin <= 0 && yMax >= 0) {
                    const py0 = yToPixel(0);
                    ctx.beginPath();
                    ctx.moveTo(0, py0);
                    ctx.lineTo(W, py0);
                    ctx.stroke();
                }
                // y轴 (x=0)
                if (xMin <= 0 && xMax >= 0) {
                    const px0 = xToPixel(0);
                    ctx.beginPath();
                    ctx.moveTo(px0, 0);
                    ctx.lineTo(px0, H);
                    ctx.stroke();
                }

                // ---- 绘制函数曲线 ----
                ctx.beginPath();
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 3;
                let started = false;
                for (let i = 0; i < data.length; i++) {
                    const d = data[i];
                    if (isNaN(d.y)) {
                        started = false;
                        continue;
                    }
                    const px = xToPixel(d.x);
                    const py = yToPixel(d.y);
                    // 裁剪边界，防止溢出
                    if (px < 0 || px > W || py < 0 || py > H) {
                        // 可画但保持连线，但为了美观，跳过极端点
                        // 这里我们简单跳过超出画布的点，避免线条飞出
                        // 更好的做法是裁剪，但简单跳过可能导致断线，但可接受
                        started = false;
                        continue;
                    }
                    if (!started) {
                        ctx.moveTo(px, py);
                        started = true;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();

                // 绘制数据点（可选小圆点）
                ctx.fillStyle = '#2563eb';
                for (let i = 0; i < data.length; i++) {
                    const d = data[i];
                    if (isNaN(d.y)) continue;
                    const px = xToPixel(d.x);
                    const py = yToPixel(d.y);
                    if (px < 0 || px > W || py < 0 || py > H) continue;
                    ctx.beginPath();
                    ctx.arc(px, py, 1.5, 0, 2 * Math.PI);
                    ctx.fill();
                }

                ctx.restore();

                // 显示坐标信息（鼠标悬停）
                // 更新提示
                const hint = document.querySelector('.canvas-hint');
                hint.textContent = `📊 范围 x: [${xMin.toFixed(2)}, ${xMax.toFixed(2)}]  y: [${yMin.toFixed(2)}, ${yMax.toFixed(2)}]  采样点: ${data.length}`;
            }

            // 画布事件：鼠标移动显示坐标
            function setupCanvasInteraction() {
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas._logicalWidth / rect.width;
                    const scaleY = canvas._logicalHeight / rect.height;
                    const mx = (e.clientX - rect.left) * scaleX;
                    const my = (e.clientY - rect.top) * scaleY;
                    // 计算数据坐标 (需知道当前范围)
                    const xMin = parseFloat(xMinInput.value);
                    const xMax = parseFloat(xMaxInput.value);
                    // 我们需要知道 yMin, yMax ？但我们没有存储，可以用画布上的坐标反推，但需要知道上次绘制的 yMin/yMax。
                    // 简单起见，我们只显示 x 坐标，y 坐标从函数计算（但需要函数表达式）
                    // 更精确：存储上次绘制的 yMin/yMax 到全局变量
                    if (typeof window._lastYMin === 'undefined') return;
                    const yMin = window._lastYMin;
                    const yMax = window._lastYMax;
                    const x = xMin + (mx / canvas._logicalWidth) * (xMax - xMin);
                    const y = yMin + (1 - my / canvas._logicalHeight) * (yMax - yMin);
                    // 尝试用函数计算真实 y
                    let realY = null;
                    try {
                        const fn = new Function('x', `"use strict"; return (${funcInput.value.trim()});`);
                        realY = fn(x);
                    } catch (e) { /* ignore */ }
                    const hint = document.querySelector('.canvas-hint');
                    if (realY !== null && isFinite(realY)) {
                        hint.textContent = `📍 x = ${x.toFixed(4)},  f(x) = ${realY.toFixed(4)}`;
                    } else {
                        hint.textContent = `📍 x = ${x.toFixed(4)}`;
                    }
                });
                canvas.addEventListener('mouseleave', () => {
                    const hint = document.querySelector('.canvas-hint');
                    hint.textContent = '🖱️ 鼠标悬停显示坐标值';
                });
            }

            // 扩展绘制，存储 yMin/yMax
            const originalDraw = drawFunction;
            drawFunction = function() {
                // 先计算范围，但不绘制，然后存储
                const expr = funcInput.value.trim();
                if (!expr) return;
                const xMin = parseFloat(xMinInput.value);
                const xMax = parseFloat(xMaxInput.value);
                if (isNaN(xMin) || isNaN(xMax) || xMin >= xMax) return;
                let points = parseInt(pointsInput.value, 10) || 100;
                let fn;
                try {
                    fn = new Function('x', `"use strict"; return (${expr});`);
                } catch (e) { return; }
                const step = (xMax - xMin) / (points - 1);
                let yMin = Infinity,
                    yMax = -Infinity;
                for (let i = 0; i < points; i++) {
                    const x = xMin + i * step;
                    let y;
                    try { y = fn(x); } catch (e) { y = NaN; }
                    if (typeof y === 'number' && isFinite(y)) {
                        if (y < yMin) yMin = y;
                        if (y > yMax) yMax = y;
                    }
                }
                if (yMin === Infinity) { yMin = -1;
                    yMax = 1; }
                const yRange = yMax - yMin;
                if (yRange === 0) { yMin -= 1;
                    yMax += 1; } else {
                    const pad = yRange * 0.1;
                    yMin -= pad;
                    yMax += pad;
                }
                window._lastYMin = yMin;
                window._lastYMax = yMax;
                originalDraw.call(this);
            };

            // 绑定绘制事件
            drawBtn.addEventListener('click', drawFunction);

            // 示例按钮
            document.querySelectorAll('.sample-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    funcInput.value = btn.dataset.fn;
                    drawFunction();
                });
            });

            // 输入框回车触发绘制
            funcInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drawFunction(); } });
            xMinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drawFunction(); } });
            xMaxInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drawFunction(); } });
            pointsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drawFunction(); } });

            // 页面加载 & 窗口调整时重绘
            window.addEventListener('load', () => {
                resizeCanvas();
                // 默认绘制 sin(x)
                drawFunction();
                setupCanvasInteraction();
            });

            window.addEventListener('resize', () => {
                resizeCanvas();
                drawFunction();
            });

            // 当输入数字变化时自动重绘（可选）
            [xMinInput, xMaxInput, pointsInput].forEach(el => {
                el.addEventListener('change', drawFunction);
            });

            // 暴露 resize 以便调试
            window._resizeCanvas = resizeCanvas;

            // ==============================================================
            //  额外：复制哈希时也支持快捷键
            // ==============================================================
            // 聚焦到 SHA 输入框
            hashInput.focus();

        })();
    </script>
</body>
</html>
