<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在线工具箱</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
            --md-primary: #8D6E63;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EFDBD1;
            --md-on-primary-container: #3E2723;
            --md-secondary: #A1887F;
            --md-secondary-container: #E5D5CF;
            --md-on-secondary-container: #3E2723;
            --md-surface: #FDF8F5;
            --md-surface-container: #F6ECE7;
            --md-surface-container-high: #F0E3DC;
            --md-on-surface: #1F1B16;
            --md-on-surface-variant: #52443C;
            --md-outline: #85736A;
            --md-outline-variant: #D8CCC4;
            --md-error: #BA1A1A;
            --md-on-error: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Microsoft YaHei', '微软雅黑', system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 900px;
            width: 100%;
            background: var(--md-surface-container);
            border-radius: 28px;
            padding: 24px 24px 28px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }

        .sub {
            color: var(--md-on-surface-variant);
            font-size: 15px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--md-outline-variant);
            padding-bottom: 14px;
        }

        .card {
            background: var(--md-surface-container-high);
            border-radius: 20px;
            padding: 20px 22px 24px;
            margin-bottom: 20px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 16px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--md-on-surface-variant);
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--md-outline);
            border-radius: 12px;
            font-size: 15px;
            background: transparent;
            color: var(--md-on-surface);
            outline: none;
            transition: border-color 0.15s, border-width 0.15s;
            font-family: inherit;
        }

        input:focus {
            border: 2px solid var(--md-primary);
            padding: 11px 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .btn {
            padding: 11px 24px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.92;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
        }
        .btn-secondary:hover {
            opacity: 0.9;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }
        .btn-danger {
            background: var(--md-error);
            color: var(--md-on-error);
        }
        .btn-danger:hover {
            opacity: 0.92;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .result-box {
            background: transparent;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--md-outline);
            font-family: "SF Mono", "JetBrains Mono", monospace;
            font-size: 14px;
            word-break: break-all;
            color: var(--md-on-surface);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .result-box .text {
            flex: 1;
            line-height: 1.6;
        }

        .result-box .copy-btn {
            background: var(--md-secondary-container);
            border: none;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--md-on-secondary-container);
            transition: opacity 0.15s;
            white-space: nowrap;
        }
        .result-box .copy-btn:hover {
            opacity: 0.9;
        }

        .hint {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            margin-top: 6px;
        }

        .verify-result {
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
        }
        .verify-result.success {
            color: #2e7d32;
        }
        .verify-result.fail {
            color: var(--md-error);
        }

        .canvas-wrapper {
            background: var(--md-surface);
            border-radius: 14px;
            border: 1px solid var(--md-outline);
            overflow: hidden;
            margin-top: 6px;
        }

        canvas#functionCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
            background: var(--md-surface);
            touch-action: none;
        }

        .canvas-hint {
            font-size: 12px;
            color: var(--md-on-surface-variant);
            margin-top: 6px;
            text-align: center;
        }

        .sample-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .sample-btns button {
            padding: 6px 14px;
            border: 1px solid var(--md-outline);
            border-radius: 999px;
            background: transparent;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .sample-btns button:hover {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
        }

        p {
            text-align: center;
        }

        a {
            color: var(--md-primary);
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>在线工具箱</h1>
        <div class="sub">纯前端小工具集 · 无需联网 · 数据不会离开你的浏览器</div>

        <div class="card">
            <h2>函数图像绘制</h2>
            <div class="input-group">
                <label for="fnInput">函数表达式 f(x)</label>
                <input type="text" id="fnInput" value="sin(x)" placeholder="例如：sin(x)、x*x、sqrt(x)、1/x">
            </div>
            <div class="canvas-wrapper">
                <canvas id="functionCanvas"></canvas>
            </div>
            <div class="sample-btns" id="sampleBtns">
                <button data-fn="sin(x)">sin(x)</button>
                <button data-fn="cos(x)">cos(x)</button>
                <button data-fn="tan(x)">tan(x)</button>
                <button data-fn="x*x">x²</button>
                <button data-fn="x*x*x">x³</button>
                <button data-fn="sqrt(x)">√x</button>
                <button data-fn="abs(x)">|x|</button>
                <button data-fn="1/x">1/x</button>
                <button data-fn="log(x)">ln(x)</button>
                <button data-fn="exp(x)">eˣ</button>
            </div>
            <div class="canvas-hint" id="fnHint">拖动平移 · 滚轮缩放 · 点击示例快速绘制</div>
        </div>

        <div class="card">
            <h2>Base64 编解码</h2>
            <div class="input-group">
                <label for="b64Input">文本内容</label>
                <input type="text" id="b64Input" placeholder="支持中文，输入要编码或解码的内容">
            </div>
            <div class="btn-group">
                <button class="btn" id="b64Encode">编码</button>
                <button class="btn btn-secondary" id="b64Decode">解码</button>
            </div>
            <div class="result-box">
                <span class="text" id="b64Result">结果将显示在这里</span>
                <button class="copy-btn" data-target="b64Result">复制</button>
            </div>
        </div>

        <div class="card">
            <h2>SHA-256 哈希</h2>
            <div class="input-group">
                <label for="hashInput">文本内容</label>
                <input type="text" id="hashInput" placeholder="输入要计算 SHA-256 的内容">
            </div>
            <div class="btn-group">
                <button class="btn" id="hashBtn">计算 SHA-256</button>
            </div>
            <div class="result-box">
                <span class="text" id="hashResult">结果将显示在这里</span>
                <button class="copy-btn" data-target="hashResult">复制</button>
            </div>
        </div>

        <div class="card">
            <h2>随机密码生成器</h2>
            <div class="input-group">
                <label for="pwdLength">密码长度（4 - 128）</label>
                <input type="number" id="pwdLength" value="16" min="4" max="128">
            </div>
            <div class="btn-group">
                <button class="btn" id="pwdBtn">生成密码</button>
            </div>
            <div class="result-box">
                <span class="text" id="pwdResult">点击按钮生成</span>
                <button class="copy-btn" data-target="pwdResult">复制</button>
            </div>
            <div class="verify-result" id="pwdStrength"></div>
        </div>

        <p class="hint"><a href="message/index.html" target="_blank">留言板</a></p>
        <p class="hint"><a href="game/index.html" target="_blank">2D 跑酷小游戏</a></p>
        <p class="hint"><a href="video/index.html" target="_blank">视频播放测试</a></p>
        <p>2026 Qianchenawa. All rights reserved. Open source on <a rel="noopener noreferrer nofollow" href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a></p>
    </div>

    <script>
    (function () {
        // ---------- 通用复制按钮 ----------
        document.querySelectorAll('.copy-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var target = document.getElementById(btn.dataset.target);
                if (!target) return;
                var text = target.textContent;
                function done() {
                    var old = btn.textContent;
                    btn.textContent = '已复制';
                    setTimeout(function () { btn.textContent = old; }, 1200);
                }
                function fallback() {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); } catch (e) {}
                    ta.remove();
                    done();
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, fallback);
                } else {
                    fallback();
                }
            });
        });

        // ---------- 函数图像绘制 ----------
        var canvas = document.getElementById('functionCanvas');
        var ctx = canvas.getContext('2d');
        var fnInput = document.getElementById('fnInput');
        var fnHint = document.getElementById('fnHint');

        var fn = null;
        var scale = 80;       // 每单位长度对应的像素数
        var ox = 0, oy = 0;   // 原点在画布(CSS 坐标)中的位置
        var cssW = 0, cssH = 0;
        var initialized = false;
        var dragging = false;
        var lastX = 0, lastY = 0;

        function compileFn(expr) {
            var s = expr.trim();
            if (!/^[0-9a-zA-Z+\-*/^()., ]+$/.test(s)) return null;
            s = s.replace(/\^/g, '**');
            s = s.replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|abs|log|exp|floor|ceil|round)\b/g, 'Math.$1');
            s = s.replace(/\bpi\b/g, 'Math.PI');
            try {
                var f = new Function('x', '"use strict"; return (' + s + ');');
                var v = f(1);
                if (typeof v !== 'number') return null;
                return f;
            } catch (e) {
                return null;
            }
        }

        function updateFn() {
            fn = compileFn(fnInput.value);
            if (fn) {
                fnHint.textContent = '拖动平移 · 滚轮缩放 · 点击示例快速绘制';
                fnHint.style.color = '';
            } else {
                fnHint.textContent = '表达式无效，请检查后重试';
                fnHint.style.color = '#dc2626';
            }
            draw();
        }

        function niceStep() {
            var raw = 60 / scale;
            var pow = Math.pow(10, Math.floor(Math.log10(raw)));
            var n = raw / pow;
            var m = n < 1.5 ? 1 : (n < 3.5 ? 2 : (n < 7.5 ? 5 : 10));
            return m * pow;
        }

        function draw() {
            var dpr = window.devicePixelRatio || 1;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            ctx.fillStyle = '#FDF8F5';
            ctx.fillRect(0, 0, cssW, cssH);

            var step = niceStep();

            // 网格
            ctx.strokeStyle = '#F0E3DC';
            ctx.lineWidth = 1;
            ctx.beginPath();
            var kxStart = Math.floor((0 - ox) / scale / step);
            var kxEnd = Math.ceil((cssW - ox) / scale / step);
            for (var kx = kxStart; kx <= kxEnd; kx++) {
                var sx = ox + kx * step * scale;
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, cssH);
            }
            var kyStart = Math.floor((oy - cssH) / scale / step);
            var kyEnd = Math.ceil(oy / scale / step);
            for (var ky = kyStart; ky <= kyEnd; ky++) {
                var sy = oy - ky * step * scale;
                ctx.moveTo(0, sy);
                ctx.lineTo(cssW, sy);
            }
            ctx.stroke();

            // 坐标轴
            ctx.strokeStyle = '#D8CCC4';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, oy);
            ctx.lineTo(cssW, oy);
            ctx.moveTo(ox, 0);
            ctx.lineTo(ox, cssH);
            ctx.stroke();

            // 函数曲线（裁剪到画布内绘制，避免缩放/平移后图像缺失）
            if (fn) {
                ctx.strokeStyle = '#8D6E63';
                ctx.lineWidth = 2;
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, cssW, cssH);
                ctx.clip();
                ctx.beginPath();
                var started = false;
                var prevY = null;
                var visH = cssH / scale;
                for (var px = 0; px <= cssW; px++) {
                    var wx = (px - ox) / scale;
                    var y;
                    try { y = fn(wx); } catch (e) { started = false; prevY = null; continue; }
                    if (typeof y !== 'number' || !isFinite(y)) { started = false; prevY = null; continue; }
                    // 渐近线/不连续点检测：符号翻转且两端超可视范围，或值突变
                    if (prevY !== null) {
                        var signFlip = (prevY * y < 0 && Math.abs(prevY) > visH && Math.abs(y) > visH);
                        var hugeJump = Math.abs(y - prevY) > visH * 1000;
                        if (signFlip || hugeJump) started = false;
                    }
                    var py = oy - y * scale;
                    if (!started) { ctx.moveTo(px, py); started = true; }
                    else { ctx.lineTo(px, py); }
                    prevY = y;
                }
                ctx.stroke();
                ctx.restore();
            }
        }

        function initCanvas() {
            var rect = canvas.getBoundingClientRect();
            var dpr = window.devicePixelRatio || 1;
            cssW = rect.width;
            cssH = rect.height;
            canvas.width = Math.max(1, Math.round(cssW * dpr));
            canvas.height = Math.max(1, Math.round(cssH * dpr));
            if (!initialized) {
                ox = cssW / 2;
                oy = cssH / 2;
                initialized = true;
            }
            draw();
        }

        canvas.addEventListener('pointerdown', function (e) {
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            ox += e.clientX - lastX;
            oy += e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            draw();
        });
        canvas.addEventListener('pointerup', function () { dragging = false; });
        canvas.addEventListener('pointercancel', function () { dragging = false; });
        canvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            var rect = canvas.getBoundingClientRect();
            var mx = e.clientX - rect.left;
            var my = e.clientY - rect.top;
            var factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            var newScale = Math.min(2000, Math.max(5, scale * factor));
            var ratio = newScale / scale;
            ox = mx - (mx - ox) * ratio;
            oy = my - (my - oy) * ratio;
            scale = newScale;
            draw();
        }, { passive: false });

        fnInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') updateFn();
        });
        fnInput.addEventListener('change', updateFn);
        document.getElementById('sampleBtns').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-fn]');
            if (!btn) return;
            fnInput.value = btn.dataset.fn;
            updateFn();
        });
        window.addEventListener('resize', initCanvas);

        // ---------- Base64 编解码 ----------
        function utf8ToBase64(str) {
            var bytes = new TextEncoder().encode(str);
            var bin = '';
            for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }
        function base64ToUtf8(str) {
            var bin = atob(str);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }
        document.getElementById('b64Encode').addEventListener('click', function () {
            try {
                document.getElementById('b64Result').textContent = utf8ToBase64(document.getElementById('b64Input').value);
            } catch (e) {
                document.getElementById('b64Result').textContent = '编码失败';
            }
        });
        document.getElementById('b64Decode').addEventListener('click', function () {
            try {
                document.getElementById('b64Result').textContent = base64ToUtf8(document.getElementById('b64Input').value.trim());
            } catch (e) {
                document.getElementById('b64Result').textContent = '解码失败：不是有效的 Base64';
            }
        });

        // ---------- SHA-256 ----------
        document.getElementById('hashBtn').addEventListener('click', function () {
            var out = document.getElementById('hashResult');
            out.textContent = '计算中…';
            if (window.crypto && crypto.subtle) {
                crypto.subtle.digest('SHA-256', new TextEncoder().encode(document.getElementById('hashInput').value))
                    .then(function (buf) {
                        var arr = Array.from(new Uint8Array(buf));
                        out.textContent = arr.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
                    })
                    .catch(function () { out.textContent = '计算失败'; });
            } else {
                out.textContent = '当前浏览器不支持 Web Crypto API';
            }
        });

        // ---------- 随机密码生成器 ----------
        function genPassword(len) {
            var upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            var lower = 'abcdefghijklmnopqrstuvwxyz';
            var digits = '0123456789';
            var symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            var all = upper + lower + digits + symbols;
            var arr = new Uint32Array(len);
            crypto.getRandomValues(arr);
            var pwd = '';
            for (var i = 0; i < len; i++) pwd += all[arr[i] % all.length];
            return pwd;
        }
        function pwdStrength(pwd) {
            var score = 0;
            if (/[a-z]/.test(pwd)) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/\d/.test(pwd)) score++;
            if (/[^a-zA-Z0-9]/.test(pwd)) score++;
            if (pwd.length >= 12) score++;
            if (pwd.length >= 20) score++;
            if (score <= 2) return { text: '强度：弱', cls: 'fail' };
            if (score <= 4) return { text: '强度：中等', cls: '' };
            return { text: '强度：强', cls: 'success' };
        }
        document.getElementById('pwdBtn').addEventListener('click', function () {
            var lenInput = document.getElementById('pwdLength');
            var len = parseInt(lenInput.value, 10);
            if (isNaN(len)) len = 16;
            len = Math.min(128, Math.max(4, len));
            lenInput.value = len;
            var pwd = genPassword(len);
            document.getElementById('pwdResult').textContent = pwd;
            var s = pwdStrength(pwd);
            var el = document.getElementById('pwdStrength');
            el.textContent = s.text;
            el.className = 'verify-result ' + s.cls;
        });

        // 初始化
        initCanvas();
        updateFn();
    })();
    </script>
    
</body>
</html>
