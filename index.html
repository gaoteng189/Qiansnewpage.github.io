<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaN</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', '微软雅黑',-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 28px 24px 34px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .sub {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 26px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 14px;
        }

        /* ----- 卡片通用 ----- */
        .card {
            background: #f9fbfd;
            border-radius: 20px;
            padding: 20px 22px 26px;
            border: 1px solid #eef2f6;
            margin-bottom: 28px;
        }

        .card:last-child {
            margin-bottom: 0;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        /* ----- 表单控件 ----- */
        label {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            display: block;
            margin-bottom: 3px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dce2ea;
            border-radius: 12px;
            font-size: 15px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .btn {
            padding: 10px 22px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #2563eb;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #eef2f6;
            color: #1e293b;
        }
        .btn-secondary:hover {
            background: #dce2ea;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .result-box {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            font-family: "SF Mono", "JetBrains Mono", monospace;
            font-size: 14px;
            word-break: break-all;
            color: #0f172a;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .result-box .text {
            flex: 1;
            line-height: 1.6;
        }

        .result-box .copy-btn {
            background: #eef2f6;
            border: none;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #334155;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .result-box .copy-btn:hover {
            background: #dce2ea;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .verify-result {
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
        }
        .verify-result.success {
            color: #16a34a;
        }
        .verify-result.fail {
            color: #dc2626;
        }

        /* ----- 函数可视化专用 ----- */
        .canvas-wrapper {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-top: 6px;
        }

        canvas#functionCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
            background: white;
            touch-action: none;
        }

        .canvas-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            text-align: center;
        }

        .sample-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .sample-btns button {
            padding: 4px 12px;
            border: 1px solid #dce2ea;
            border-radius: 16px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sample-btns button:hover {
            background: #eef2f6;
        }
        p {
         text-align: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <p><a href="video/index.html" target="_blank">视频播放测试</a></p>
        <p>开发中，敬请期待</p>
        <p>
            2026 Qianchenawa. All rights reserved. Open source on <a rel="noopener noreferrer nofollow"  href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a>
        </p>
    </div>
    
</body>
</html>
