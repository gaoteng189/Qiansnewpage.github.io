<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D 跑酷</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        /* Fluent Design 2 · 天蓝 */
        :root {
            --accent: #0EA5E9;
            --accent-hover: #28B4F0;
            --accent-pressed: #0284C7;
            --accent-soft: #E7F4FD;

            --bg: #F3F6F9;
            --layer: #FFFFFF;
            --layer-alt: #F7FAFC;
            --stroke: #E3E9EF;
            --stroke-strong: #C8D3DC;

            --text: #1B1B1B;
            --text-2: #5A6672;

            --danger: #D13438;

            --r-lg: 12px;
            --r-md: 8px;
            --r-sm: 4px;

            --shadow-2: 0 1px 2px rgba(16, 24, 40, .06);
            --shadow-4: 0 2px 6px rgba(16, 24, 40, .08);
            --shadow-8: 0 6px 18px rgba(16, 24, 40, .10);

            /* 兼容既有变量名 */
            --md-primary: var(--accent);
            --md-on-primary: #FFFFFF;
            --md-primary-container: var(--accent-soft);
            --md-on-primary-container: #0B4A6F;
            --md-secondary: #64748B;
            --md-secondary-container: var(--accent-soft);
            --md-on-secondary-container: #0B4A6F;
            --md-surface: var(--bg);
            --md-surface-container: var(--layer);
            --md-surface-container-high: var(--layer-alt);
            --md-on-surface: var(--text);
            --md-on-surface-variant: var(--text-2);
            --md-outline: var(--stroke-strong);
            --md-outline-variant: var(--stroke);
            --md-error: var(--danger);
            --md-on-error: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Microsoft YaHei', '微软雅黑', system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .shell {
            width: 100%;
            max-width: 840px;
            background: var(--md-surface-container);
            border-radius: 28px;
            padding: 20px 20px 24px;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 0 4px 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .scoreboard {
            display: flex;
            gap: 8px;
        }

        .pill {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill .num {
            font-variant-numeric: tabular-nums;
            min-width: 24px;
            text-align: center;
        }

        .stage {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: var(--md-surface);
            outline: 1px solid var(--md-outline);
            outline-offset: -1px;
        }

        canvas#game {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: rgba(253, 248, 245, 0.72);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            text-align: center;
            padding: 24px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 30px;
            font-weight: 700;
            color: var(--md-on-surface);
        }

        .overlay .desc {
            color: var(--md-on-surface-variant);
            font-size: 15px;
            line-height: 1.6;
        }

        .overlay .final-score {
            font-size: 20px;
            font-weight: 700;
            color: var(--md-on-primary-container);
        }

        .btn {
            border: none;
            cursor: pointer;
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 16px;
            font-weight: 600;
            padding: 14px 34px;
            border-radius: 999px;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.92;
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-tonal {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
        }

        .level-row {
            display: flex;
            gap: 8px;
        }

        .chip {
            border: none;
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: background-color .15s, color .15s;
        }

        .chip:hover { opacity: .88; }

        .chip.active {
            background: var(--md-primary);
            color: var(--md-on-primary);
        }

        .hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            padding-top: 14px;
        }

        .sound-btn {
            border: none;
            background: transparent;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 9px;
            border-radius: 999px;
            transition: background-color .12s;
        }

        .sound-btn:hover { background: var(--md-secondary-container); }

        footer {
            text-align: center;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            margin-top: 18px;
        }

        footer a {
            color: var(--md-primary);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* ---------- Fluent Design 细化 ---------- */
        body { background: var(--bg); }

        .shell {
            background: var(--layer);
            border: 1px solid var(--stroke);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-8);
        }

        h1 { font-size: 22px; font-weight: 600; }

        .pill {
            background: var(--accent-soft);
            color: var(--accent-pressed);
            border-radius: var(--r-sm);
            padding: 7px 14px;
            font-size: 13px;
        }

        .stage {
            border-radius: var(--r-md);
            border: 1px solid var(--stroke);
            outline: none;
        }

        .overlay {
            background: rgba(255, 255, 255, .82);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
        }

        .overlay h2 { font-size: 26px; font-weight: 600; }
        .overlay .desc { font-size: 14px; color: var(--text-2); }
        .overlay .final-score { color: var(--accent-pressed); font-size: 18px; }

        .btn {
            border-radius: var(--r-sm);
            font-size: 15px;
            padding: 11px 26px;
        }
        .btn:hover { background: var(--accent-hover); opacity: 1; }
        .btn:active { background: var(--accent-pressed); transform: none; }

        .btn-tonal {
            background: var(--layer);
            color: var(--text);
            border: 1px solid var(--stroke-strong);
        }
        .btn-tonal:hover { background: var(--layer-alt); }

        .chip {
            background: var(--layer);
            color: var(--text-2);
            border: 1px solid var(--stroke-strong);
            border-radius: var(--r-sm);
            padding: 7px 16px;
        }
        .chip:hover { background: var(--layer-alt); opacity: 1; }
        .chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--md-on-primary);
        }

        .hint { color: var(--text-2); }
        .sound-btn { border-radius: var(--r-sm); }
        footer { color: var(--text-2); }
        footer a { color: var(--accent-pressed); }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <h1>2D 跑酷</h1>
            <div class="scoreboard">
                <div class="pill">分数 <span class="num" id="score">0</span></div>
                <div class="pill">最佳 <span class="num" id="best">0</span></div>
            </div>
        </header>

        <div class="stage">
            <canvas id="game"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="overlayTitle">2D 跑酷</h2>
                <p class="desc" id="overlayDesc">空格 / 点击画面 / 触摸 跳跃<br>支持二段跳，避开障碍物，跑得越远越好</p>
                <div class="level-row" id="levelRow">
                    <button class="chip" data-level="easy">简单</button>
                    <button class="chip active" data-level="normal">普通</button>
                    <button class="chip" data-level="hard">困难</button>
                </div>
                <div class="final-score hidden" id="finalScore"></div>
                <button class="btn" id="startBtn">开始游戏</button>
            </div>
        </div>

        <p class="hint">
            <span>空格 / 点击 / 触摸 跳跃</span>
            <button class="sound-btn" id="soundBtn" title="音效开关">🔊</button>
        </p>
    </div>

    <footer>
        2026 Qianchenawa. Licensed under MIT. Open source on <a rel="noopener noreferrer nofollow" href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a>
    </footer>

    <script>
    (function () {
        // ---------- 画布与坐标 ----------
        var canvas = document.getElementById('game');
        var ctx = canvas.getContext('2d');
        var WORLD_W = 800, WORLD_H = 450;
        var GROUND_Y = 370;
        var GRAVITY = 1800;
        var JUMP_V = -640;
        var JUMPS_MAX = 2;

        var W = 0, H = 0;

        function resize() {
            var rect = canvas.getBoundingClientRect();
            var dpr = window.devicePixelRatio || 1;
            W = rect.width;
            H = rect.height;
            canvas.width = Math.max(1, Math.round(W * dpr));
            canvas.height = Math.max(1, Math.round(H * dpr));
            ctx.setTransform(dpr * W / WORLD_W, 0, 0, dpr * H / WORLD_H, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // ---------- 颜色 ----------
        var COL = {
            sky: '#FFFFFF',
            hill: '#E7F4FD',
            ground: '#F7FAFC',
            groundLine: '#C8D3DC',
            player: '#0EA5E9',
            playerEye: '#FFFFFF',
            obstacle: '#334155',
            cloud: '#EEF3F7'
        };

        // ---------- 状态 ----------
        var state = 'ready'; // ready | playing | over
        var player = {
            x: 120,
            w: 34,
            h: 46,
            y: GROUND_Y,      // 底部 y
            vy: 0,
            jumpsLeft: JUMPS_MAX
        };
        var obstacles = [];
        var clouds = [];
        var hills = [];
        var score = 0;
        var best = 0;
        var speed = 0;
        var spawnTimer = 0;
        var lastTime = 0;
        var lastMilestone = 0;

        // ---------- 难度 ----------
        var LEVELS = {
            easy:   { label: '简单', speed: 280, maxSpeed: 520, accel: 0.35, gap: 1.55, minGap: 0.85 },
            normal: { label: '普通', speed: 320, maxSpeed: 700, accel: 0.5,  gap: 1.35, minGap: 0.55 },
            hard:   { label: '困难', speed: 385, maxSpeed: 920, accel: 0.72, gap: 1.05, minGap: 0.40 }
        };
        var level = 'normal';
        try {
            var savedLevel = localStorage.getItem('runner_level');
            if (savedLevel && LEVELS[savedLevel]) level = savedLevel;
        } catch (e) {}

        try {
            best = parseInt(localStorage.getItem('runner_best'), 10) || 0;
        } catch (e) { best = 0; }
        document.getElementById('best').textContent = best;

        // 初始化背景元素
        for (var i = 0; i < 6; i++) {
            clouds.push({ x: Math.random() * WORLD_W, y: 40 + Math.random() * 120, r: 18 + Math.random() * 26 });
        }
        for (var j = 0; j < 3; j++) {
            hills.push({ x: j * 280, w: 180 + Math.random() * 80, h: 70 + Math.random() * 90 });
        }

        // ---------- DOM ----------
        var overlay = document.getElementById('overlay');
        var overlayTitle = document.getElementById('overlayTitle');
        var overlayDesc = document.getElementById('overlayDesc');
        var finalScore = document.getElementById('finalScore');
        var startBtn = document.getElementById('startBtn');
        var scoreEl = document.getElementById('score');
        var bestEl = document.getElementById('best');
        var levelRow = document.getElementById('levelRow');
        var soundBtn = document.getElementById('soundBtn');

        // ---------- 音效（Web Audio 合成，无需外部资源） ----------
        var audioCtx = null;
        var soundOn = true;
        try {
            soundOn = localStorage.getItem('runner_sound') !== 'off';
        } catch (e) {}

        function updateSoundBtn() {
            soundBtn.textContent = soundOn ? '🔊' : '🔇';
            soundBtn.title = soundOn ? '音效已开启（点击关闭）' : '音效已关闭（点击开启）';
        }
        updateSoundBtn();

        function beep(freq, dur, type, vol) {
            if (!soundOn) return;
            try {
                if (!audioCtx) {
                    var AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    audioCtx = new AC();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                var t = audioCtx.currentTime;
                gain.gain.setValueAtTime(vol == null ? 0.06 : vol, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + dur);
            } catch (e) {}
        }

        soundBtn.addEventListener('click', function () {
            soundOn = !soundOn;
            try { localStorage.setItem('runner_sound', soundOn ? 'on' : 'off'); } catch (e) {}
            updateSoundBtn();
            if (soundOn) beep(660, 0.1, 'sine');
        });

        // ---------- 难度切换 ----------
        function syncLevelBtns() {
            Array.prototype.forEach.call(levelRow.querySelectorAll('.chip'), function (b) {
                b.classList.toggle('active', b.dataset.level === level);
            });
        }

        levelRow.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-level]');
            if (!btn || state === 'playing') return;
            level = btn.dataset.level;
            try { localStorage.setItem('runner_level', level); } catch (e) {}
            syncLevelBtns();
            beep(520, 0.08, 'sine');
        });

        syncLevelBtns();

        function setOverlay(mode, isRecord) {
            if (mode === 'ready') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = '2D 跑酷';
                overlayDesc.textContent = '空格 / 点击画面 / 触摸 跳跃\n支持二段跳，避开障碍物，跑得越远越好';
                levelRow.style.display = '';
                finalScore.classList.add('hidden');
                startBtn.textContent = '开始游戏';
            } else if (mode === 'over') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = isRecord ? '🎉 新纪录！' : '游戏结束';
                overlayDesc.textContent = isRecord ? '打破了自己的最好成绩，厉害！' : '跑得不错，再来一次？';
                levelRow.style.display = '';
                finalScore.classList.remove('hidden');
                finalScore.textContent = '本次得分：' + Math.floor(score) + '　最佳：' + best +
                    '　难度：' + LEVELS[level].label;
                startBtn.textContent = '重新开始';
            } else {
                overlay.classList.add('hidden');
            }
        }

        function startGame() {
            state = 'playing';
            score = 0;
            speed = LEVELS[level].speed;
            spawnTimer = 0.6;
            lastMilestone = 0;
            obstacles.length = 0;
            player.y = GROUND_Y;
            player.vy = 0;
            player.jumpsLeft = JUMPS_MAX;
            setOverlay('playing');
            beep(440, 0.12, 'triangle');
        }

        function gameOver() {
            state = 'over';
            var s = Math.floor(score);
            var isRecord = s > best;
            if (isRecord) {
                best = s;
                try { localStorage.setItem('runner_best', best); } catch (e) {}
                bestEl.textContent = best;
            }
            beep(140, 0.4, 'sawtooth', 0.09);
            setOverlay('over', isRecord);
        }

        function jump() {
            if (state !== 'playing') return;
            if (player.jumpsLeft > 0) {
                player.vy = JUMP_V;
                player.jumpsLeft--;
                // 二段跳音调更高
                beep(player.jumpsLeft === 0 ? 700 : 520, 0.1, 'triangle');
            }
        }

        startBtn.addEventListener('click', startGame);
        canvas.addEventListener('pointerdown', function () {
            if (state === 'playing') {
                jump();
            } else if (state === 'ready' || state === 'over') {
                startGame();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                if (state === 'playing') {
                    jump();
                } else if (state === 'ready' || state === 'over') {
                    startGame();
                }
            }
        });

        // ---------- 生成障碍 ----------
        function spawnObstacle() {
            var w = 22 + Math.random() * 26;
            var h = 32 + Math.random() * 44;
            obstacles.push({ x: WORLD_W + 20, w: w, h: h, y: GROUND_Y });
        }

        // ---------- 更新 ----------
        function update(dt) {
            if (state !== 'playing') return;

            score += speed * dt * 0.01;
            var cfg = LEVELS[level];
            speed = Math.min(cfg.maxSpeed, cfg.speed + score * cfg.accel);
            scoreEl.textContent = Math.floor(score);

            // 每 100 分提示一次
            var milestone = Math.floor(score / 100);
            if (milestone > lastMilestone) {
                lastMilestone = milestone;
                beep(880, 0.14, 'sine', 0.05);
            }

            // 玩家
            player.vy += GRAVITY * dt;
            player.y += player.vy * dt;
            if (player.y >= GROUND_Y) {
                player.y = GROUND_Y;
                player.vy = 0;
                player.jumpsLeft = JUMPS_MAX;
            }

            // 障碍
            spawnTimer -= dt;
            var interval = Math.max(cfg.minGap, cfg.gap - speed * 0.0012);
            if (spawnTimer <= 0) {
                spawnObstacle();
                spawnTimer = interval * (0.7 + Math.random() * 0.6);
            }
            for (var i = obstacles.length - 1; i >= 0; i--) {
                var o = obstacles[i];
                o.x -= speed * dt;
                if (o.x + o.w < -20) {
                    obstacles.splice(i, 1);
                    continue;
                }
                // AABB 碰撞
                var px0 = player.x, px1 = player.x + player.w;
                var py0 = player.y - player.h, py1 = player.y;
                var ox0 = o.x, ox1 = o.x + o.w;
                var oy0 = o.y - o.h, oy1 = o.y;
                if (px0 < ox1 && px1 > ox0 && py0 < oy1 && py1 > oy0) {
                    gameOver();
                    return;
                }
            }

            // 云
            for (var c = 0; c < clouds.length; c++) {
                clouds[c].x -= 40 * dt;
                if (clouds[c].x < -60) {
                    clouds[c].x = WORLD_W + 40;
                    clouds[c].y = 40 + Math.random() * 120;
                }
            }
            // 山丘
            for (var hh = 0; hh < hills.length; hh++) {
                hills[hh].x -= 60 * dt;
                if (hills[hh].x + hills[hh].w < 0) {
                    hills[hh].x += hills.length * 280;
                    hills[hh].w = 180 + Math.random() * 80;
                    hills[hh].h = 70 + Math.random() * 90;
                }
            }
        }

        // ---------- 绘制 ----------
        function roundRect(x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function draw() {
            // 天空
            ctx.fillStyle = COL.sky;
            ctx.fillRect(0, 0, WORLD_W, WORLD_H);

            // 云
            ctx.fillStyle = COL.cloud;
            for (var c = 0; c < clouds.length; c++) {
                var cl = clouds[c];
                ctx.beginPath();
                ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2);
                ctx.arc(cl.x + cl.r * 0.9, cl.y + 6, cl.r * 0.7, 0, Math.PI * 2);
                ctx.arc(cl.x - cl.r * 0.9, cl.y + 6, cl.r * 0.65, 0, Math.PI * 2);
                ctx.fill();
            }

            // 山丘
            ctx.fillStyle = COL.hill;
            for (var hh = 0; hh < hills.length; hh++) {
                var hl = hills[hh];
                roundRect(hl.x, GROUND_Y - hl.h, hl.w, hl.h, 24);
                ctx.fill();
            }

            // 地面
            ctx.fillStyle = COL.ground;
            ctx.fillRect(0, GROUND_Y, WORLD_W, WORLD_H - GROUND_Y);
            ctx.fillStyle = COL.groundLine;
            ctx.fillRect(0, GROUND_Y, WORLD_W, 4);

            // 障碍
            for (var i = 0; i < obstacles.length; i++) {
                var o = obstacles[i];
                ctx.fillStyle = COL.obstacle;
                roundRect(o.x, o.y - o.h, o.w, o.h, 8);
                ctx.fill();
            }

            // 玩家
            ctx.fillStyle = COL.player;
            roundRect(player.x, player.y - player.h, player.w, player.h, 10);
            ctx.fill();
            // 眼睛
            ctx.fillStyle = COL.playerEye;
            ctx.beginPath();
            ctx.arc(player.x + player.w - 11, player.y - player.h + 12, 3.5, 0, Math.PI * 2);
            ctx.arc(player.x + player.w - 11, player.y - player.h + 22, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // ---------- 主循环 ----------
        function loop(now) {
            var dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
            lastTime = now;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }
        setOverlay('ready');
        requestAnimationFrame(function (now) {
            lastTime = now;
            requestAnimationFrame(loop);
        });
    })();
    </script>
</body>
</html>
