<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        html, body {
            height: 100%;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://webcnstatic.yostar.net/ba_cn_web/prod/upload/wallpaper/gzp2DYV2.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        .content {
            position: relative;
            z-index: 1;
            padding: 20px;
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 28px 24px 32px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .sub {
            font-weight: bold;
            color: #52f3ff;
            text-align: center;
            font-size: 20px;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #000;
            display: block;
            margin-bottom: 18px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            color: #eee;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #52f3ff;
            color: #fff;
            transform: translateY(-2px);
        }
        .btn.active {
            background: #52f3ff;
            color: #0b1e33;
            border-color: #52f3ff;
            box-shadow: 0 4px 16px rgba(82, 243, 255, 0.4);
        }
        .btn.active:hover {
            background: #7af6ff;
        }

        .current-hint {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 6px;
        }
        .current-hint strong {
            color: #52f3ff;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body::before {
                background-image: url('https://webcnstatic.yostar.net/ba_cn_web/prod/upload/wallpaper/MefDndfh.jpeg');
            }
            .app {
                padding: 18px 14px 22px;
            }
            .sub {
                font-size: 17px;
            }
            .btn {
                font-size: 13px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="app">
            <div class="sub">Blue Archive 1st PV</div>

            <video id="player" controls autoplay loop playsinline>
                <source src="video1.mp4" type="video/mp4">
                Err: Your browser does not support the video tag.
                错误： 您的浏览器不支持视频播放。
            </video>

            <div class="btn-group" id="btnGroup">
                <button class="btn active" data-video="video1.mp4" data-name="BA 1ST PV">BA 1ST PV</button>
                <button class="btn" data-video="video2.mp4" data-name="GGF">GGF</button>
                <button class="btn" data-video="video3.mp4" data-name="Luminous Memory">Luminous Memory</button>
            </div>

            <div class="current-hint">
                当前播放：<strong id="currentName"></strong>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const video = document.getElementById('player');
            const buttons = document.querySelectorAll('#btnGroup .btn');
            const currentName = document.getElementById('currentName');

            function switchVideo(btn) {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const videoUrl = btn.dataset.video;
                const name = btn.dataset.name || btn.textContent.trim();

                video.src = videoUrl;
                video.load();


                video.play().catch(() => {});

                currentName.textContent = name;
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    switchVideo(this);
                });
            });

            const activeBtn = document.querySelector('#btnGroup .btn.active');
            if (activeBtn) {
                currentName.textContent = activeBtn.dataset.name || activeBtn.textContent.trim();
            } else {
                const first = buttons[0];
                if (first) {
                    first.classList.add('active');
                    currentName.textContent = first.dataset.name || first.textContent.trim();
                }
            }
        })();
    </script>
</body>
</html>
