<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', '微软雅黑',-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        html,body {
            height: 100%;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;   /* 固定定位，背景不随滚动 */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://webcnstatic.yostar.net/ba_cn_web/prod/upload/wallpaper/gzp2DYV2.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;       /* 放在所有内容后面 */
        }
        .content {
            position: relative;  /* 确保在背景上方（因为 z-index 层级） */
            z-index: 1;          /* 显式高于 -1 */
            padding: 20px;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            min-height: 100vh;   /* 撑满视口高度，内容多时自动扩展 */
        }
        @media (max-width: 768px) {
            body::before {
                background-image: url('https://webcnstatic.yostar.net/ba_cn_web/prod/upload/wallpaper/MefDndfh.jpeg');
            }
        }
    </style>
</head>
    <body>
        <div class="content">
            <div class="app">

                <div class="sub">视频播放测试</div>

                <video width="100%" height="auto" autoplay loop controls>
                    <source src="http://tixcheqy4.hd-bkt.clouddn.com/video.mp4" type="video/mp4">
                    您的浏览器不支持 HTML5 视频标签
                </video>
                <audio width="100%" height="auto" autoplay loop controls>
                    <source src="http://tixcheqy4.hd-bkt.clouddn.com/back.ogg" type="audio/mpeg">
                    您的浏览器不支持 HTML5 音频标签
                </audio>
            </div>
        </div>
    </body>
</html>
