<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Archive</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        html, body {
            height: 100%;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://webcnstatic.yostar.net/ba_cn_web/prod/upload/wallpaper/gzp2DYV2.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        .content {
            position: relative;
            z-index: 1;
            padding: 20px;
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 28px 24px 32px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .sub {
            font-weight: bold;
            color: #52f3ff;
            text-align: center;
            font-size: 20px;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #000;
            display: block;
            margin-bottom: 18px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            color: #eee;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #52f3ff;
            color: #fff;
            transform: translateY(-2px);
        }
        .btn.active {
            background: #52f3ff;
            color: #0b1e33;
            border-color: #52f3ff;
            box-shadow: 0 4px 16px rgba(82, 243, 255, 0.4);
        }
        .btn.active:hover {
            background: #7af6ff;
        }

        .current-hint {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 6px;
        }
        .current-hint strong {
            color: #52f3ff;
            font-weight: 600;
        }

        p {
         text-align: center;
        }

        @media (max-width: 768px) {
            body::before {
                background-image: url('https://webcnstatic.yostar.net/ba_cn_web/prod/upload/wallpaper/MefDndfh.jpeg');
            }
            .app {
                padding: 18px 14px 22px;
            }
            .sub {
                font-size: 17px;
            }
            .btn {
                font-size: 13px;
                padding: 6px 14px;
            }
        }

        .top-left-logo {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 256px; 
        height: auto;
        z-index: 10; 
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.3); 
        }

        @media (max-width: 768px) {
            .top-left-logo {
                width: 40px;
                top: 10px;
                left: 10px;
            }
        }

        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none; 
            max-width: 360px;
            width: 100%;
        }

        .toast {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            color: #f1f5f9;
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #52f3ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transform: translateX(120%);
            opacity: 0;
            animation: toastIn 0.4s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
            font-size: 15px;
            line-height: 1.5;
            transition: opacity 0.3s, transform 0.3s;
        }

        .toast.out {
            animation: toastOut 0.3s ease-in forwards;
        }

        .toast .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast .toast-msg {
            flex: 1;
            word-break: break-word;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast .toast-close:hover {
            color: #fff;
        }

        .toast.info {
            border-left-color: #52f3ff;
        }
        .toast.success {
            border-left-color: #4ade80;
        }
        .toast.warning {
            border-left-color: #fbbf24;
        }
        .toast.error {
            border-left-color: #f87171;
        }

        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        @media (max-width: 480px) {
            .toast-container {
                top: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
                width: auto;
            }
            .toast {
                font-size: 14px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="content">
        <img src="Logo.png" alt="Logo" class="top-left-logo" onclick="showToast('你跑不过巧乐兹你信不信（zxf老师~~ 我还记得你~~）', 'info', 2000)" />
        <div class="app">
            <div class="sub">Blue Archive (点击左上角图片有惊喜)</div>

            <video id="player" width="100%" height="auto" autoplay muted loop controls playsinline preload="metadata">
                <source src="BA1STPV.mp4" type="video/mp4">
                Error: Your browser cannot play the video.
                错误： 您的浏览器不支持此视频播放。
            </video>

            <div class="btn-group" id="btnGroup">
                <button class="btn active" data-video="BA1STPV.mp4" data-name="BA 1ST PV">BA 1ST PV</button>
                <button class="btn" data-video="GGF.mp4" data-name="GGF">GGF</button>
                <button class="btn" data-video="LuminousMemory.mp4" data-name="Luminous Memory">Luminous Memory</button>
            </div>
        </div>
        
    </div>
    <p>
        2026 Qianchenawa. All rights reserved.    Open source on <a href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a><span style="color: #52f3ff;font-weight: bold;">点击左上角图片有惊喜</span>
    </p>
    <script>
        (function() {
            const video = document.getElementById('player');
            const buttons = document.querySelectorAll('#btnGroup .btn');
            const currentName = document.getElementById('currentName');

            function switchVideo(btn) {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const videoUrl = btn.dataset.video;
                const name = btn.dataset.name || btn.textContent.trim();

                video.src = videoUrl;
                video.load();


                video.play().catch(() => {});

                currentName.textContent = name;
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    switchVideo(this);
                });
            });

            const activeBtn = document.querySelector('#btnGroup .btn.active');
            if (activeBtn) {
                currentName.textContent = activeBtn.dataset.name || activeBtn.textContent.trim();
            } else {
                const first = buttons[0];
                if (first) {
                    first.classList.add('active');
                    currentName.textContent = first.dataset.name || first.textContent.trim();
                }
            }
        })();

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                info: 'ℹ️',
                success: '✅',
                warning: '⚠️',
                error: '❌'
            };
            const icon = icons[type] || 'ℹ️';

            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-msg">${message}</span>
                <button class="toast-close">&times;</button>
            `;

            container.appendChild(toast);

            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                removeToast(toast);
            });

            let timeoutId = setTimeout(() => {
                removeToast(toast);
            }, duration);

            toast.addEventListener('mouseenter', () => {
                clearTimeout(timeoutId);
            });
            toast.addEventListener('mouseleave', () => {
                timeoutId = setTimeout(() => {
                    removeToast(toast);
                }, duration);
            });

        function removeToast(el) {
            if (el.classList.contains('out')) return;
            el.classList.add('out');
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 300);
        }
    }
    </script>
</body>
</html>
