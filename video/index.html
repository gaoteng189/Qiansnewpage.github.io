<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Archive</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        :root {
            --md-primary: #8D6E63;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #EFDBD1;
            --md-on-primary-container: #3E2723;
            --md-secondary: #A1887F;
            --md-secondary-container: #E5D5CF;
            --md-on-secondary-container: #3E2723;
            --md-surface: #FDF8F5;
            --md-surface-container: #F6ECE7;
            --md-surface-container-high: #F0E3DC;
            --md-on-surface: #1F1B16;
            --md-on-surface-variant: #52443C;
            --md-outline: #85736A;
            --md-outline-variant: #D8CCC4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Microsoft YaHei', '微软雅黑', system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部柔和光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            height: 70vh;
            background: radial-gradient(ellipse at center, rgba(141, 110, 99, 0.16), transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .app-bar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 24px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            cursor: pointer;
            object-fit: cover;
        }

        .app-title .title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }
        .app-title .subtitle {
            font-size: 12px;
            color: var(--md-on-surface-variant);
            margin-top: 2px;
        }

        .main {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 8px 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .player-card {
            background: var(--md-surface-container);
            border-radius: 24px;
            padding: 12px;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #000;
            display: block;
        }

        .segmented {
            display: flex;
            gap: 4px;
            background: var(--md-surface-container-high);
            border-radius: 999px;
            padding: 4px;
        }

        .btn {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            border-radius: 999px;
            color: var(--md-on-surface-variant);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }
        .btn:hover {
            color: var(--md-on-surface);
        }
        .btn.active {
            background: var(--md-primary);
            color: var(--md-on-primary);
        }

        .current-hint {
            text-align: center;
            font-size: 14px;
            color: var(--md-on-surface-variant);
        }
        .current-hint strong {
            color: var(--md-primary);
            font-weight: 600;
        }

        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            padding: 20px;
        }
        footer a {
            color: var(--md-primary);
            text-decoration: none;
        }

        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-width: 360px;
            width: 100%;
        }

        .toast {
            pointer-events: auto;
            background: var(--md-surface-container-high);
            color: var(--md-on-surface);
            padding: 14px 20px;
            border-radius: 14px;
            border-left: 4px solid var(--md-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transform: translateX(120%);
            opacity: 0;
            animation: toastIn 0.4s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
            font-size: 15px;
            line-height: 1.5;
            transition: opacity 0.3s, transform 0.3s;
        }

        .toast.out {
            animation: toastOut 0.3s ease-in forwards;
        }

        .toast .toast-icon { font-size: 20px; flex-shrink: 0; }
        .toast .toast-msg { flex: 1; word-break: break-word; }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .toast .toast-close:hover { color: var(--md-on-surface); }

        .toast.info { border-left-color: var(--md-primary); }
        .toast.success { border-left-color: #4ade80; }
        .toast.warning { border-left-color: #fbbf24; }
        .toast.error { border-left-color: #f87171; }

        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        @media (max-width: 600px) {
            .app-bar { padding: 14px 16px; }
            .app-title .title { font-size: 17px; }
            .main { padding: 4px 12px 24px; }
            .btn { font-size: 12px; padding: 8px 6px; }
            .toast-container { top: 16px; right: 16px; left: 16px; max-width: none; width: auto; }
            .toast { font-size: 14px; padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <header class="app-bar">
        <img src="Logo.png" alt="Logo" class="logo" onclick="switchToNZS()" />
        <div class="app-title">
            <div class="title">Blue Archive</div>
            <div class="subtitle">点击左上角 Logo 有惊喜</div>
        </div>
    </header>

    <main class="main">
        <div class="player-card">
            <video id="player" width="100%" height="auto" autoplay muted loop controls webkit-playsinline preload="metadata">
                <source src="BA1STPV.mp4" type="video/mp4">
                Error: Your browser cannot play the video.
                错误： 您的浏览器不支持此视频播放。
            </video>
        </div>

        <div class="segmented" id="btnGroup">
            <button class="btn active" data-video="BA1STPV.mp4" data-name="BA 1ST PV">BA 1ST PV</button>
            <button class="btn" data-video="GGF.mp4" data-name="GGF">GGF</button>
            <button class="btn" data-video="LuminousMemory.mp4" data-name="Luminous Memory">Luminous Memory</button>
        </div>

        <div class="current-hint">
            当前播放：<strong id="currentName"></strong>
        </div>
    </main>

    <footer>
        2026 Qianchenawa. All rights reserved. Open source on <a rel="noopener noreferrer nofollow" href="https://github.com/gaoteng189/Qiansnewpage.github.io" target="_blank">Github</a>
    </footer>
    <script>
        (function() {
            const video = document.getElementById('player');
            const buttons = document.querySelectorAll('#btnGroup .btn');
            const currentName = document.getElementById('currentName');

            function switchVideo(btn) {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const videoUrl = btn.dataset.video;
                const name = btn.dataset.name || btn.textContent.trim();

                video.src = videoUrl;
                video.load();


                video.play().catch(() => {});

                currentName.textContent = name;
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    switchVideo(this);
                });
            });

            const activeBtn = document.querySelector('#btnGroup .btn.active');
            if (activeBtn) {
                currentName.textContent = activeBtn.dataset.name || activeBtn.textContent.trim();
            } else {
                const first = buttons[0];
                if (first) {
                    first.classList.add('active');
                    currentName.textContent = first.dataset.name || first.textContent.trim();
                }
            }
        })();

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                info: 'ℹ️',
                success: '✅',
                warning: '⚠️',
                error: '❌'
            };
            const icon = icons[type] || 'ℹ️';

            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-msg">${message}</span>
                <button class="toast-close">&times;</button>
            `;

            container.appendChild(toast);

            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                removeToast(toast);
            });

            let timeoutId = setTimeout(() => {
                removeToast(toast);
            }, duration);

            toast.addEventListener('mouseenter', () => {
                clearTimeout(timeoutId);
            });
            toast.addEventListener('mouseleave', () => {
                timeoutId = setTimeout(() => {
                    removeToast(toast);
                }, duration);
            });

        function removeToast(el) {
            if (el.classList.contains('out')) return;
            el.classList.add('out');
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 300);
        }
        }

    function switchToNZS() {
        const video = document.getElementById('player');
        video.src = 'NZS.mp4';
        video.load();
        video.play().catch(() => {});

        const nameDisplay = document.getElementById('currentName');
        if (nameDisplay) {
            nameDisplay.textContent = 'NZS';
        }

        document.querySelectorAll('#btnGroup .btn').forEach(btn => {
            btn.classList.remove('active');
        });

        showToast('你跑不过巧乐兹你信不信（zxf老师~~ 我还记得你~~）', 'info', 2000);
    }

    </script>
</body>
</html>
